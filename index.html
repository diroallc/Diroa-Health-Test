<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100 selection:bg-cyan-500 selection:text-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diroa Health - Personal Health Profiles & Emergency ID</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
              950: '#083344',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          backgroundImage: {
            'radial-gradient': 'radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.15) 0%, rgba(15, 23, 42, 0) 70%)',
            'glass-card': 'linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%)',
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Custom Glow & Scrollbar Effects */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }

    .glow-cyan {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.25);
    }
    
    .glow-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glow-card:hover {
      border-color: rgba(6, 182, 212, 0.4);
      box-shadow: 0 10px 30px -10px rgba(6, 182, 212, 0.15);
    }

    /* Print Styles for Emergency ID Card */
    @media print {
      body * {
        visibility: hidden;
      }
      #emergency-card-print, #emergency-card-print * {
        visibility: visible;
      }
      #emergency-card-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 24px;
        box-shadow: none !important;
        border: 2px solid #000000 !important;
        border-radius: 12px !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col antialiased bg-radial-gradient">

  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Supabase Backend Client Credentials
    const SUPABASE_URL = "https://ikzrbztopdmxhneloyim.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrenJienRvcGRteGhuZWxveWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzM0MDUsImV4cCI6MjEwNTk0OTQwNX0.yOtplAIElZrbdx-M-Cs12vE5Av6p8uBxiYY3IkHMCwA";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial Blank Profile Schema
    const BLANK_PROFILE = {
      full_name: '',
      dob: '',
      gender: '',
      blood_type: '',
      height: '',
      weight: '',
      physician_name: '',
      physician_phone: '',
      preferred_hospital: '',
      emergency_name: '',
      emergency_relation: '',
      emergency_phone: '',
      allergies: '',
      medications: '',
      chronic_conditions: '',
      surgeries: '',
      insurance_provider: '',
      policy_id: '',
      group_id: ''
    };

    const Icons = {
      Shield: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
      User: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
      FileText: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
      QrCode: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>,
      Folder: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>,
      LogOut: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
      CheckCircle: () => <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      AlertCircle: () => <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Plus: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>,
      Print: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
      Upload: () => <svg className="w-8 h-8 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>,
      Activity: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>,
      Heart: () => <svg className="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>,
      Phone: () => <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>,
      Search: () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    };

    function App() {
      const [session, setSession] = useState(null);
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [profile, setProfile] = useState(BLANK_PROFILE);
      const [loadingProfile, setLoadingProfile] = useState(false);
      const [savingProfile, setSavingProfile] = useState(false);
      const [vaultDocs, setVaultDocs] = useState([]);
      
      // Toast State
      const [toast, setToast] = useState(null);

      // Auth Modal State
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setUser(session?.user ?? null);
          if (session?.user) {
            fetchUserProfile(session.user.id);
          }
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          setUser(session?.user ?? null);
          if (session?.user) {
            fetchUserProfile(session.user.id);
          } else {
            setProfile(BLANK_PROFILE);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchUserProfile = async (userId) => {
        setLoadingProfile(true);
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .single();

          if (error && error.code !== 'PGRST116') {
            console.error('Error fetching profile:', error.message);
          } else if (data) {
            setProfile(data);
          }
        } catch (err) {
          console.error('Unexpected error fetching profile:', err);
        } finally {
          setLoadingProfile(false);
        }
      };

      const handleSaveProfile = async (e) => {
        if (e) e.preventDefault();
        setSavingProfile(true);

        try {
          if (!user) {
            showToast('Saved locally in browser session! Sign in to sync across devices.', 'info');
            setSavingProfile(false);
            return;
          }

          const updates = {
            id: user.id,
            ...profile,
            updated_at: new Date().toISOString(),
          };

          const { error } = await supabase
            .from('profiles')
            .upsert(updates);

          if (error) {
            console.error('Supabase save error:', error);
            showToast(`Save failed: ${error.message}`, 'error');
          } else {
            showToast('Health profile synced with cloud database!', 'success');
          }
        } catch (err) {
          showToast(`Error saving profile: ${err.message}`, 'error');
        } finally {
          setSavingProfile(false);
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError('');

        try {
          if (authMode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            showToast('Account created successfully!', 'success');
            setAuthModalOpen(false);
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            showToast('Signed in successfully!', 'success');
            setAuthModalOpen(false);
          }
        } catch (err) {
          setAuthError(err.message || 'Authentication failed');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setProfile(BLANK_PROFILE);
        showToast('Signed out successfully', 'info');
      };

      // Profile completion metrics
      const completionStats = useMemo(() => {
        const keys = Object.keys(BLANK_PROFILE);
        const filled = keys.filter(k => profile[k] && profile[k].trim() !== '').length;
        const percent = Math.round((filled / keys.length) * 100);
        const isReady = profile.full_name.trim() !== '' && profile.blood_type !== '';
        return { filled, total: keys.length, percent, isReady };
      }, [profile]);

      return (
        <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* Toast Notification Banner */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl border text-sm font-medium transition-all duration-300 backdrop-blur-md ${
              toast.type === 'error' ? 'bg-red-950/90 border-red-800 text-red-200' :
              toast.type === 'info' ? 'bg-cyan-950/90 border-cyan-800 text-cyan-200' :
              'bg-emerald-950/90 border-emerald-800 text-emerald-200'
            }`}>
              {toast.type === 'error' ? <Icons.AlertCircle /> : <Icons.CheckCircle />}
              <span>{toast.message}</span>
            </div>
          )}

          {/* Top Header */}
          <header className="border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-xl sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-20">
                
                {/* Brand Logo */}
                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => setActiveTab('dashboard')}>
                  <div className="p-2.5 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 group-hover:border-cyan-400 transition-all glow-cyan">
                    <Icons.Shield />
                  </div>
                  <div>
                    <div className="text-xl font-black tracking-tight text-white flex items-center gap-2">
                      DIROA <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400 font-light">HEALTH</span>
                    </div>
                    <div className="flex items-center gap-2 mt-0.5">
                      <span className="text-[10px] uppercase font-mono font-semibold tracking-widest text-slate-400">
                        diroa.com
                      </span>
                      <span className="w-1 h-1 rounded-full bg-slate-700"></span>
                      <span className="text-[10px] text-cyan-400/80 font-mono">v2.5 Modern</span>
                    </div>
                  </div>
                </div>

                {/* Navigation Menu */}
                <nav className="hidden md:flex items-center gap-1.5 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800/80 shadow-inner">
                  {[
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.User },
                    { id: 'profile', label: 'Profile Editor', icon: Icons.FileText },
                    { id: 'card', label: 'Emergency ID', icon: Icons.QrCode },
                    { id: 'vault', label: 'Medical Vault', icon: Icons.Folder }
                  ].map((tab) => {
                    const Icon = tab.icon;
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 ${
                          isActive 
                            ? 'bg-gradient-to-r from-cyan-500 to-cyan-600 text-slate-950 shadow-lg shadow-cyan-500/25 font-bold' 
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'
                        }`}
                      >
                        <Icon />
                        {tab.label}
                      </button>
                    );
                  })}
                </nav>

                {/* Account / Sync Controls */}
                <div className="flex items-center gap-3">
                  <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-900/80 border border-slate-800/80 text-xs text-slate-400 font-mono">
                    <span className="relative flex h-2 w-2">
                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span>{user ? 'Cloud Sync Active' : 'Local Sandbox Mode'}</span>
                  </div>

                  {user ? (
                    <div className="flex items-center gap-3 border-l border-slate-800 pl-3">
                      <div className="text-right hidden sm:block">
                        <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-500">Account</div>
                        <div className="text-xs font-mono text-cyan-300 max-w-[150px] truncate">{user.email}</div>
                      </div>
                      <button 
                        onClick={handleSignOut}
                        className="p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-400 hover:text-rose-400 transition-colors"
                        title="Sign Out"
                      >
                        <Icons.LogOut />
                      </button>
                    </div>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => { setAuthMode('signin'); setAuthModalOpen(true); }}
                        className="px-3.5 py-2 text-xs font-semibold text-slate-300 hover:text-white transition-colors"
                      >
                        Sign In
                      </button>
                      <button
                        onClick={() => { setAuthMode('signup'); setAuthModalOpen(true); }}
                        className="px-4 py-2 text-xs font-bold bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-xl shadow-lg shadow-cyan-500/20 transition-all"
                      >
                        Create Account
                      </button>
                    </div>
                  )}
                </div>

              </div>
            </div>

            {/* Mobile Nav */}
            <div className="md:hidden flex overflow-x-auto border-t border-slate-800 bg-slate-950 px-3 py-2 gap-1.5 scrollbar-none">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: Icons.User },
                { id: 'profile', label: 'Profile Editor', icon: Icons.FileText },
                { id: 'card', label: 'Emergency Card', icon: Icons.QrCode },
                { id: 'vault', label: 'Medical Vault', icon: Icons.Folder }
              ].map((tab) => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center gap-2 whitespace-nowrap px-3.5 py-2 rounded-xl text-xs font-semibold ${
                      isActive 
                        ? 'bg-cyan-500 text-slate-950 font-bold' 
                        : 'text-slate-400 bg-slate-900/60'
                    }`}
                  >
                    <Icon />
                    {tab.label}
                  </button>
                );
              })}
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            {activeTab === 'dashboard' && (
              <DashboardView 
                profile={profile} 
                stats={completionStats} 
                setActiveTab={setActiveTab}
                user={user}
                setAuthModalOpen={setAuthModalOpen}
              />
            )}

            {activeTab === 'profile' && (
              <ProfileEditorView 
                profile={profile} 
                setProfile={setProfile} 
                handleSaveProfile={handleSaveProfile}
                savingProfile={savingProfile}
                stats={completionStats}
              />
            )}

            {activeTab === 'card' && (
              <EmergencyCardView 
                profile={profile} 
                isReady={completionStats.isReady}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === 'vault' && (
              <MedicalVaultView 
                vaultDocs={vaultDocs} 
                setVaultDocs={setVaultDocs} 
                showToast={showToast}
              />
            )}
          </main>

          {/* Authentication Modal */}
          {authModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-8 shadow-2xl relative glow-cyan">
                <button 
                  onClick={() => setAuthModalOpen(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-slate-200 text-sm font-mono"
                >
                  ✕
                </button>

                <div className="flex items-center gap-2.5 mb-2 text-cyan-400 font-bold">
                  <Icons.Shield />
                  <span className="text-xs uppercase tracking-widest font-mono">Diroa Cloud Security</span>
                </div>

                <h2 className="text-2xl font-extrabold text-white mb-1">
                  {authMode === 'signup' ? 'Create Health Vault' : 'Sign In to Portal'}
                </h2>
                <p className="text-slate-400 text-xs mb-6">
                  {authMode === 'signup' 
                    ? 'Securely persist your personal health profiles & medical intake data.' 
                    : 'Access your encrypted medical profiles and printable ID cards.'}
                </p>

                {authError && (
                  <div className="mb-4 p-3.5 bg-red-950/60 border border-red-800/80 rounded-xl text-xs text-red-300 flex items-center gap-2">
                    <Icons.AlertCircle />
                    <span>{authError}</span>
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                    <input 
                      type="email" 
                      required
                      placeholder="name@domain.com" 
                      value={authEmail}

            <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                  Known Allergies (Comma Separated)
                </label>
                <textarea
                  rows="3"
                  placeholder="e.g. Penicillin, Peanuts, Latex"
                  value={profile.allergies}
                  onChange={(e) => handleChange('allergies', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                  Current Medications & Dosage
                </label>
                <textarea
                  rows="3"
                  placeholder="e.g. Lisinopril 10mg daily, Metformin 500mg"
                  value={profile.medications}
                  onChange={(e) => handleChange('medications', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                  Chronic Conditions
                </label>
                <textarea
                  rows="2"
                  placeholder="e.g. Asthma, Type 2 Diabetes, Hypertension"
                  value={profile.chronic_conditions}
                  onChange={(e) => handleChange('chronic_conditions', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                ></textarea>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">
                  Surgical History
                </label>
                <textarea
                  rows="2"
                  placeholder="e.g. Appendectomy (2018), Knee Arthroscopy (2021)"
                  value={profile.surgeries}
                  onChange={(e) => handleChange('surgeries', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                ></textarea>
              </div>
            </div>
          </div>

          {/* Section 4: Insurance */}
          <div className="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-7 space-y-5 glow-card">
            <h2 className="text-base font-extrabold text-white border-b border-slate-800/80 pb-3">
              5. Insurance Details
            </h2>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">Insurance Provider</label>
                <input
                  type="text"
                  placeholder="e.g. Blue Cross"
                  value={profile.insurance_provider}
                  onChange={(e) => handleChange('insurance_provider', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">Policy / Member ID</label>
                <input
                  type="text"
                  placeholder="e.g. XEH9981209"
                  value={profile.policy_id}
                  onChange={(e) => handleChange('policy_id', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">Group Number</label>
                <input
                  type="text"
                  placeholder="e.g. G-8871"
                  value={profile.group_id}
                  onChange={(e) => handleChange('group_id', e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                />
              </div>
            </div>
          </div>

          <div className="flex justify-end pt-2">
            <button
              type="submit"
              disabled={savingProfile}
              className="px-8 py-3.5 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-xl shadow-cyan-500/25 transition-all disabled:opacity-50"
            >
              {savingProfile ? 'Saving Profile...' : 'Save Health Profile'}
            </button>
          </div>
        </form>
      );
    }

    function EmergencyCardView({ profile, isReady, setActiveTab }) {
      const qrPayload = useMemo(() => {
        const payload = {
          name: profile.full_name || 'Unspecified',
          blood: profile.blood_type || 'Unspecified',
          emergency: `${profile.emergency_name} (${profile.emergency_phone})`,
          allergies: profile.allergies || 'None listed',
          conditions: profile.chronic_conditions || 'None listed'
        };
        return encodeURIComponent(JSON.stringify(payload));
      }, [profile]);

      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrPayload}&bgcolor=ffffff&color=020617`;

      if (!isReady) {
        return (
          <div className="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-12 text-center max-w-xl mx-auto space-y-5 my-8">
            <div className="w-16 h-16 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center justify-center mx-auto">
              <Icons.AlertCircle />
            </div>
            <h2 className="text-xl font-black text-white">Emergency Card Incomplete</h2>
            <p className="text-slate-400 text-xs sm:text-sm leading-relaxed">
              Please complete at least your **Full Name** and **Blood Type** in the Health Profile Editor to unlock your printable Emergency Health ID Card.
            </p>
            <button
              onClick={() => setActiveTab('profile')}
              className="inline-block px-6 py-3 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs uppercase tracking-wider transition-all shadow-lg"
            >
              Complete Profile Form
            </button>
          </div>
        );
      }

      return (
        <div className="space-y-6 max-w-3xl mx-auto">
          
          <div className="flex items-center justify-between no-print">
            <div>
              <h1 className="text-2xl font-black text-white">Digital Emergency ID</h1>
              <p className="text-slate-400 text-xs mt-0.5">High-visibility responder badge formatted for mobile screen or physical card.</p>
            </div>

            <button
              onClick={() => window.print()}
              className="inline-flex items-center gap-2 px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-cyan-400 rounded-2xl text-xs font-extrabold border border-slate-800 transition-all shadow-md"
            >
              <Icons.Print />
              <span>Print Emergency ID</span>
            </button>
          </div>

          {/* Card Frame */}
          <div 
            id="emergency-card-print"
            className="bg-slate-900 border-2 border-cyan-500/50 rounded-3xl p-8 shadow-2xl relative overflow-hidden space-y-6 glow-cyan"
          >
            {/* Header Red Alert Line */}
            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
              <div className="flex items-center gap-2.5">
                <span className="relative flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-rose-500"></span>
                </span>
                <span className="text-xs font-black uppercase tracking-widest text-rose-400 font-mono">
                  EMERGENCY MEDICAL ID
                </span>
              </div>
              <span className="text-[11px] font-mono text-slate-500">DIROA.COM PROTOCOL</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
              
              <div className="md:col-span-2 space-y-4">
                <div>
                  <span className="text-[10px] uppercase font-mono font-bold tracking-widest text-slate-500 block">
                    Patient Name
                  </span>
                  <h2 className="text-3xl font-black text-white tracking-tight">{profile.full_name || 'N/A'}</h2>
                  <div className="text-xs text-slate-400 mt-1 font-mono">
                    DOB: {profile.dob || 'Unspecified'} • Gender: {profile.gender || 'N/A'}
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 pt-1">
                  <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800/80">
                    <span className="text-[10px] uppercase font-mono font-bold text-rose-400 block">Blood Type</span>
                    <span className="text-2xl font-black text-white font-mono">{profile.blood_type || 'N/A'}</span>
                  </div>

                  <div className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800/80">
                    <span className="text-[10px] uppercase font-mono font-bold text-cyan-400 block">Emergency Contact</span>
                    <span className="text-xs font-bold text-slate-200 block truncate">{profile.emergency_name || 'N/A'}</span>
                    <span className="text-[11px] text-slate-400 font-mono">{profile.emergency_phone || 'No Phone'}</span>
                  </div>
                </div>

                <div className="space-y-2 pt-2 text-xs">
                  <div>
                    <span className="font-bold text-slate-400 block">Allergies:</span>
                    <span className="text-amber-300 font-medium">{profile.allergies || 'None declared'}</span>
                  </div>

                  <div>
                    <span className="font-bold text-slate-400 block">Active Medications:</span>
                    <span className="text-slate-300">{profile.medications || 'None listed'}</span>
                  </div>
                </div>
              </div>

              {/* Scannable QR Code Box */}
              <div className="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-inner text-center">
                <img 
                  src={qrUrl} 
                  alt="Emergency Medical QR Code" 
                  className="w-40 h-40 object-contain"
                />
                <span className="text-[10px] font-mono font-bold text-slate-900 mt-2 uppercase tracking-wider">
                  SCAN FOR MEDICAL DATA
                </span>
              </div>

            </div>

            <div className="pt-4 border-t border-slate-800 flex items-center justify-between text-[11px] font-mono text-slate-500">
              <span>Physician: {profile.physician_name || 'Unassigned'}</span>
              <span>Preferred Hospital: {profile.preferred_hospital || 'Nearest ER'}</span>
            </div>
          </div>
        </div>
      );
    }

    function MedicalVaultView({ vaultDocs, setVaultDocs, showToast }) {
      const [docTitle, setDocTitle] = useState('');
      const [docCategory, setDocCategory] = useState('Lab Result');

      const handleAddDocument = (e) => {
        e.preventDefault();
        if (!docTitle.trim()) return;

        const newDoc = {
          id: Date.now(),
          title: docTitle,
          category: docCategory,
          date: new Date().toLocaleDateString(),
          size: '1.4 MB'
        };

        setVaultDocs([newDoc, ...vaultDocs]);
        setDocTitle('');
        showToast('Document cataloged in vault!', 'success');
      };

      return (
        <div className="space-y-8">
          <div className="border-b border-slate-800 pb-4">
            <h1 className="text-2xl font-black text-white">Medical Vault</h1>
            <p className="text-slate-400 text-xs mt-1">
              Store and reference medical records, blood tests, and prescriptions.
            </p>
          </div>

          <div className="bg-slate-900/80 border border-slate-800/80 rounded-3xl p-7 glow-card space-y-4">
            <h3 className="text-base font-extrabold text-white">Catalog New Document Record</h3>
            
            <form onSubmit={handleAddDocument} className="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div className="sm:col-span-2">
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">Document Title</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Comprehensive Metabolic Panel 2026"
                  value={docTitle}
                  onChange={(e) => setDocTitle(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5">Category</label>
                <select
                  value={docCategory}
                  onChange={(e) => setDocCategory(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
                >
                  <option value="Lab Result">Lab Result</option>
                  <option value="Prescription">Prescription</option>
                  <option value="Imaging / X-Ray">Imaging / X-Ray</option>
                  <option value="Vaccination">Vaccination</option>
                  <option value="Insurance Claim">Insurance Claim</option>
                </select>
              </div>

              <div className="sm:col-span-3 flex justify-end">
                <button
                  type="submit"
                  className="px-6 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-xs uppercase tracking-wider shadow-lg transition-all flex items-center gap-2"
                >
                  <Icons.Plus />
                  <span>Add Document</span>
                </button>
              </div>
            </form>
          </div>

          {vaultDocs.length === 0 ? (
            <div className="bg-slate-900/40 border-2 border-dashed border-slate-800/80 rounded-3xl p-12 text-center space-y-3">
              <Icons.Upload />
              <h3 className="text-base font-bold text-slate-300">Vault Empty</h3>
              <p className="text-slate-500 text-xs max-w-sm mx-auto">
                No health documents added yet. Catalog records above to attach them to your session.
              </p>
            </div>
          ) : (
            <div className="bg-slate-900/80 border border-slate-800/80 rounded-3xl overflow-hidden">
              <div className="px-6 py-4 border-b border-slate-800 font-extrabold text-xs uppercase tracking-wider text-slate-400">
                Cataloged Vault Items ({vaultDocs.length})
              </div>
              <div className="divide-y divide-slate-800/80">
                {vaultDocs.map((doc) => (
                  <div key={doc.id} className="p-5 flex items-center justify-between hover:bg-slate-800/40 transition-colors">
                    <div className="flex items-center gap-4">
                      <div className="p-3 rounded-2xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                        <Icons.FileText />
                      </div>
                      <div>
                        <div className="font-bold text-sm text-slate-100">{doc.title}</div>
                        <div className="text-xs text-slate-500 mt-0.5 font-mono">
                          Category: <span className="text-cyan-400">{doc.category}</span> • Added: {doc.date}
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setVaultDocs(vaultDocs.filter(d => d.id !== doc.id))}
                      className="text-xs text-slate-500 hover:text-rose-400 transition-colors font-mono"
                    >
                      Remove
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
