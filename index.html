    // =========================================================================
    // 3. AUTHENTICATION HELPERS
    // =========================================================================

    async function handleSignUp(email, password, fullName) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: fullName } }
      });

      if (error) {
        alert('Registration Error: ' + error.message);
        return false;
      }

      alert('Account registered! If email confirmation is enabled, check your inbox.');
      return true;
    }

    async function handleLogin(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('Login Error: ' + error.message);
        return null;
      }

      return data.user;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
    }


    // =========================================================================
    // 4. PROFILE DATABASE HELPERS
    // =========================================================================

    async function fetchUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.error('Error fetching profile:', error.message);
      }

      return data;
    }

    async function saveUserProfile(userId, profileData) {
      const payload = {
        id: userId,
        ...profileData,
        updated_at: new Date().toISOString()
      };

      const { data, error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

      if (error) {
        alert('Error saving profile: ' + error.message);
        return false;
      }

      return true;
    }


    // =========================================================================
    // 5. MAIN REACT APPLICATION
    // =========================================================================

    function App() {

      // -----------------------------------------------------------------------
      // AUTH STATE
      // -----------------------------------------------------------------------
      const [user, setUser] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [activeTab, setActiveTab] = React.useState('dashboard');

      // -----------------------------------------------------------------------
      // AUTH MODAL
      // -----------------------------------------------------------------------
      const [showAuthModal, setShowAuthModal] = React.useState(false);
      const [isSignUp, setIsSignUp] = React.useState(false);
      const [authEmail, setAuthEmail] = React.useState('');
      const [authPassword, setAuthPassword] = React.useState('');
      const [authConfirmPassword, setAuthConfirmPassword] = React.useState('');
      const [authName, setAuthName] = React.useState('');
      const [authError, setAuthError] = React.useState('');

      // -----------------------------------------------------------------------
      // PROFILE FORM
      // -----------------------------------------------------------------------
      const [fullName, setFullName] = React.useState('');
      const [bloodType, setBloodType] = React.useState('');
      const [age, setAge] = React.useState('');
      const [height, setHeight] = React.useState('');
      const [weight, setWeight] = React.useState('');
      const [primaryDoctor, setPrimaryDoctor] = React.useState('');
      const [allergies, setAllergies] = React.useState('');
      const [medications, setMedications] = React.useState('');
      const [emergencyContact, setEmergencyContact] = React.useState('');
      const [saving, setSaving] = React.useState(false);

      // Current medical condition / diagnosis, edited directly from the Dashboard
      const [medicalCondition, setMedicalCondition] = React.useState('');
      const [savingCondition, setSavingCondition] = React.useState(false);

      // -----------------------------------------------------------------------
      // MEDICAL VAULT STATE
      // -----------------------------------------------------------------------
      const [uploading, setUploading] = React.useState(false);
      const [uploadMessage, setUploadMessage] = React.useState('');
      const [uploadError, setUploadError] = React.useState('');
      const [vaultFiles, setVaultFiles] = React.useState([]);
      const [vaultLoading, setVaultLoading] = React.useState(false);
      const [deletingFile, setDeletingFile] = React.useState(null);
      const fileInputRef = React.useRef(null);


      // =========================================================================
      // 6. INITIAL AUTH SESSION
      // =========================================================================

      React.useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) {
            loadProfile(currentUser.id);
          }
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) {
            loadProfile(currentUser.id);
          } else {
            setUserProfile(null);
            clearForm();
            setVaultFiles([]);
          }
        });

        return () => subscription.unsubscribe();
      }, []);


      // =========================================================================
      // 7. LOAD VAULT FILES WHEN VAULT TAB IS OPEN
      // =========================================================================

      React.useEffect(() => {
        if (user && activeTab === 'vault') {
          loadVaultFiles(user.id);
        }
      }, [activeTab, user]);


      // =========================================================================
      // 8. CLEAR PROFILE FORM
      // =========================================================================

      function clearForm() {
        setFullName('');
        setBloodType('');
        setAge('');
        setHeight('');
        setWeight('');
        setPrimaryDoctor('');
        setAllergies('');
        setMedications('');
        setEmergencyContact('');
        setMedicalCondition('');
      }


      // =========================================================================
      // 9. LOAD PROFILE
      // =========================================================================

      async function loadProfile(userId) {
        const data = await fetchUserProfile(userId);

        if (data) {
          setUserProfile(data);
          setFullName(data.full_name || '');
          setBloodType(data.blood_type || '');
          setAge(data.age || '');
          setHeight(data.height || '');
          setWeight(data.weight || '');
          setPrimaryDoctor(data.primary_doctor || '');
          setAllergies(Array.isArray(data.allergies) ? data.allergies.join(', ') : (data.allergies || ''));
          setMedications(Array.isArray(data.medications) ? data.medications.join(', ') : (data.medications || ''));
          setEmergencyContact(data.emergency_contact || '');
          setMedicalCondition(data.medical_condition || '');
        } else {
          // If there is no profile row yet, use the user's auth metadata.
          const metadata = user?.user_metadata || {};
          if (metadata.full_name && !fullName) {
            setFullName(metadata.full_name);
          }
        }
      }


      // =========================================================================
      // 10. LOAD FILES FROM THE USER'S VAULT FOLDER
      // =========================================================================

      async function loadVaultFiles(userId) {
        if (!userId) return;

        setVaultLoading(true);
        setUploadError('');

        try {
          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .list(userId, {
              limit: 100,
              offset: 0,
              sortBy: { column: 'created_at', order: 'desc' }
            });

          if (error) {
            console.error('Vault list error:', error);

            if (error.message && error.message.toLowerCase().includes('bucket not found')) {
              setUploadError('The "medical-vault" bucket does not exist yet. Run the Supabase SQL setup provided above.');
            } else {
              setUploadError('Could not load your vault: ' + error.message);
            }

            setVaultFiles([]);
            return;
          }

          const files = (data || [])
            .filter(file => file.name)
            .map(file => ({ ...file, path: `${userId}/${file.name}` }));

          setVaultFiles(files);
        } catch (error) {
          console.error('Vault load error:', error);
          setUploadError('Could not load your vault files.');
        } finally {
          setVaultLoading(false);
        }
      }


      // =========================================================================
      // 11. UPLOAD FILE
      // =========================================================================

      async function handleVaultUpload(file) {
        if (!user) {
          setUploadError('You must be signed in to upload files.');
          return;
        }

        if (!file) {
          return;
        }

        // Only allow medical document formats for now
        const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg'];

        if (!allowedTypes.includes(file.type)) {
          setUploadError('Only PDF, PNG, and JPG files are allowed.');
          setUploadMessage('');
          if (fileInputRef.current) fileInputRef.current.value = '';
          return;
        }

        // 25 MB maximum
        const maxSize = 25 * 1024 * 1024;

        if (file.size > maxSize) {
          setUploadError('File is too large. Maximum size is 25MB.');
          setUploadMessage('');
          if (fileInputRef.current) fileInputRef.current.value = '';
          return;
        }

        setUploading(true);
        setUploadMessage('');
        setUploadError('');

        try {
          // Remove unsafe characters from the original filename
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

          // Give every uploaded file a unique filename
          const uniqueId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);

          // IMPORTANT: the first folder is the Supabase user ID.
          // This is what the Storage RLS policies use.
          const filePath = `${user.id}/${uniqueId}-${safeName}`;

          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .upload(filePath, file, {
              cacheControl: '3600',
              upsert: false,
              contentType: file.type
            });

          if (error) {
            console.error('Vault upload error:', error);

            if (error.message && error.message.toLowerCase().includes('bucket not found')) {
              setUploadError('Upload failed because the "medical-vault" bucket does not exist. Run the Supabase SQL setup above.');
            } else {
              setUploadError('Upload failed: ' + error.message);
            }

            return;
          }

          setUploadMessage(`Uploaded successfully: ${file.name}`);

          // Refresh the vault immediately
          await loadVaultFiles(user.id);
        } catch (error) {
          console.error('Vault upload error:', error);
          setUploadError('Something went wrong during the upload.');
        } finally {
          setUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      }


      // =========================================================================
      // 12. DOWNLOAD / OPEN A FILE
      // =========================================================================

      async function handleVaultDownload(file) {
        if (!user) return;

        setUploadError('');

        try {
          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(file.path, 60 * 10);

          if (error) {
            console.error('Signed URL error:', error);
            setUploadError('Could not open the file: ' + error.message);
            return;
          }

          if (data?.signedUrl) {
            window.open(data.signedUrl, '_blank', 'noopener,noreferrer');
          }
        } catch (error) {
          console.error('Download error:', error);
          setUploadError('Could not open this file.');
        }
      }


      // =========================================================================
      // 13. DELETE A FILE
      // =========================================================================

      async function handleVaultDelete(file) {
        if (!user) return;

        const confirmed = window.confirm(`Delete "${file.name}" permanently?`);
        if (!confirmed) return;

        setDeletingFile(file.path);
        setUploadError('');

        try {
          const { error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .remove([file.path]);

          if (error) {
            console.error('Delete error:', error);
            setUploadError('Could not delete the file: ' + error.message);
            return;
          }

          setVaultFiles(previous => previous.filter(item => item.path !== file.path));
          setUploadMessage(`Deleted: ${file.name}`);
        } catch (error) {
          console.error('Delete error:', error);
          setUploadError('Something went wrong while deleting the file.');
        } finally {
          setDeletingFile(null);
        }
      }

      // 14. AUTH MODAL FUNCTIONS

      function closeAuthModal() {
        setShowAuthModal(false);
        setAuthError('');
        setAuthEmail('');

      // 15. SUBMIT AUTH
      // =========================================================================

      async function submitAuth(e) {
        e.preventDefault();
        setAuthError('');

        if (isSignUp) {
          // Verify-password check: both password fields must match before
          // we ever call the Supabase backend.
          if (authPassword !== authConfirmPassword) {
            setAuthError('Passwords do not match. Please re-enter them.');
            return;
          }

          if (authPassword.length < 6) {
            setAuthError('Password must be at least 6 characters.');
            return;
          }

          const success = await handleSignUp(authEmail, authPassword, authName);
          if (success) {
            closeAuthModal();
          }
        } else {
          const loggedInUser = await handleLogin(authEmail, authPassword);
          if (loggedInUser) {
            setShowAuthModal(false);
            setAuthEmail('');
            setAuthPassword('');
          }
        }

      function formatFileSize(bytes) {
        if (!bytes) return 'Unknown size';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatFileDate(dateString) {
        if (!dateString) return '';
        return new Date(dateString).toLocaleString(undefined, {
          dateStyle: 'medium',

        if (extension === 'png' || extension === 'jpg' || extension === 'jpeg') return '🖼️';

                                <button
                                  onClick={() => handleVaultDownload(file)}
                                  className="px-3 py-1.5 text-[10px] font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition"
                                >
                                  Open
                                </button>
                                <button
                                  onClick={() => handleVaultDelete(file)}
                                  disabled={deletingFile === file.path}
                                  className="px-3 py-1.5 text-[10px] font-semibold bg-slate-800 hover:bg-red-900/50 text-red-400 border border-slate-700 hover:border-red-800 rounded-lg transition disabled:opacity-50"
                                >
                                  {deletingFile === file.path ? 'Deleting...' : 'Delete'}
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}

              </div>
            ) : (
              /* SIGNED OUT HERO STATE */
              <div className="text-center py-20">
                <img
                  src={DIROA_LOGO}
                  alt="Diroa Health"
                  draggable="false"
                  className="h-12 sm:h-14 w-auto select-none mx-auto mb-6"
                />
                <h2 className="text-3xl font-extrabold text-white mb-3">Diroa Health Portal</h2>
                <p className="text-slate-400 max-w-md mx-auto mb-8 text-xs leading-relaxed">
                  Sign in or register an account to manage your digital health profile, view medical records, and save emergency information.
                </p>
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-xl shadow-xl shadow-cyan-900/40 transition hover:scale-105 transform"
                >
                  Access Your Portal
                </button>
              </div>
            )}
          </main>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
                <button
                  onClick={closeAuthModal}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <h3 className="text-lg font-bold text-white mb-1">
                  {isSignUp ? 'Create Health Account' : 'Sign In to Diroa'}
                </h3>
                <p className="text-xs text-slate-400 mb-6">
                  {isSignUp ? 'Enter your details to create a new profile.' : 'Access your connected health record.'}
                </p>

                <form onSubmit={submitAuth} className="space-y-4">
                  {isSignUp && (
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        placeholder="e.g. Alex Morgan"
                      />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="name@example.com"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="••••••••"
                    />
                  </div>

                  {isSignUp && (
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Confirm Password</label>
                      <input
                        type="password"
                        required
                        value={authConfirmPassword}
                        onChange={(e) => setAuthConfirmPassword(e.target.value)}
                        className={`w-full bg-slate-900 border rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none ${authConfirmPassword && authConfirmPassword !== authPassword ? 'border-red-500 focus:border-red-500' : 'border-slate-700 focus:border-cyan-500'}`}
                        placeholder="••••••••"
                      />
                    </div>
                  )}

                  {authError && (
                    <p className="text-xs text-red-400 -mt-1">{authError}</p>
                  )}

                  <button
                    type="submit"
                    className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-md shadow-cyan-900/30"
                  >
                    {isSignUp ? 'Register Account' : 'Sign In'}
                  </button>
                </form>

                <div className="mt-4 text-center">
                  <button
                    type="button"
                    onClick={toggleAuthMode}
                    className="text-xs text-cyan-400 hover:underline"
                  >
                    {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Register"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
