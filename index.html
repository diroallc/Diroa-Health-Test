<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diroa Health - Personal Health Profiles & Emergency ID</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfeff',
              100: '#cffafe',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Print Styles for Emergency ID Card */
    @media print {
      body * {
        visibility: hidden;
      }
      #emergency-card-print, #emergency-card-print * {
        visibility: visible;
      }
      #emergency-card-print {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 20px;
        box-shadow: none !important;
        border: 2px solid #000000 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-cyan-500 selection:text-slate-950">

  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Supabase Backend Client Credentials
    const SUPABASE_URL = "https://ikzrbztopdmxhneloyim.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrenJienRvcGRteGhuZWxveWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzM0MDUsImV4cCI6MjEwNTk0OTQwNX0.yOtplAIElZrbdx-M-Cs12vE5Av6p8uBxiYY3IkHMCwA";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initial Blank Profile Template
    const BLANK_PROFILE = {
      full_name: '',
      dob: '',
      gender: '',
      blood_type: '',
      height: '',
      weight: '',
      physician_name: '',
      physician_phone: '',
      preferred_hospital: '',
      emergency_name: '',
      emergency_relation: '',
      emergency_phone: '',
      allergies: '',
      medications: '',
      chronic_conditions: '',
      surgeries: '',
      insurance_provider: '',
      policy_id: '',
      group_id: ''
    };

    const Icons = {
      Shield: () => <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>,
      User: () => <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
      FileText: () => <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>,
      QrCode: () => <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>,
      Folder: () => <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>,
      LogOut: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>,
      CheckCircle: () => <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      AlertCircle: () => <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Plus: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>,
      Print: () => <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>,
      Upload: () => <svg class="w-8 h-8 text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
    };

    function App() {
      const [session, setSession] = useState(null);
      const [user, setUser] = useState(null);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [profile, setProfile] = useState(BLANK_PROFILE);
      const [loadingProfile, setLoadingProfile] = useState(false);
      const [savingProfile, setSavingProfile] = useState(false);
      const [vaultDocs, setVaultDocs] = useState([]);
      
      // Toast state
      const [toast, setToast] = useState(null);

      // Auth Modal State
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin' or 'signup'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      // Show temporary toast message
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      useEffect(() => {
        // Fetch active session
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setUser(session?.user ?? null);
          if (session?.user) {
            fetchUserProfile(session.user.id);
          }
        });

        // Listen for auth state changes
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          setUser(session?.user ?? null);
          if (session?.user) {
            fetchUserProfile(session.user.id);
          } else {
            setProfile(BLANK_PROFILE);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const fetchUserProfile = async (userId) => {
        setLoadingProfile(true);
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .single();

          if (error && error.code !== 'PGRST116') {
            // PGRST116 means no rows returned, which is normal for brand new users
            console.error('Error fetching profile:', error.message);
          } else if (data) {
            setProfile(data);
          }
        } catch (err) {
          console.error('Unexpected error fetching profile:', err);
        } finally {
          setLoadingProfile(false);
        }
      };

      const handleSaveProfile = async (e) => {
        if (e) e.preventDefault();
        setSavingProfile(true);

        try {
          if (!user) {
            // Unauthenticated state: Save to local state only and prompt
            showToast('Saved locally! Sign up or Sign in to sync across devices.', 'info');
            setSavingProfile(false);
            return;
          }

          const updates = {
            id: user.id,
            ...profile,
            updated_at: new Date().toISOString(),
          };

          const { error } = await supabase
            .from('profiles')
            .upsert(updates);

          if (error) {
            console.error('Supabase save error:', error);
            showToast(`Save failed: ${error.message}`, 'error');
          } else {
            showToast('Health profile saved successfully!', 'success');
          }
        } catch (err) {
          showToast(`Error saving profile: ${err.message}`, 'error');
        } finally {
          setSavingProfile(false);
        }
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setAuthError('');

        try {
          if (authMode === 'signup') {
            const { data, error } = await supabase.auth.signUp({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            showToast('Account created! You are now logged in.', 'success');
            setAuthModalOpen(false);
          } else {
            const { data, error } = await supabase.auth.signInWithPassword({
              email: authEmail,
              password: authPassword,
            });
            if (error) throw error;
            showToast('Signed in successfully!', 'success');
            setAuthModalOpen(false);
          }
        } catch (err) {
          setAuthError(err.message || 'Authentication failed');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setProfile(BLANK_PROFILE);
        showToast('Signed out successfully', 'info');
      };

      // Helper to count completed items
      const isProfileComplete = useMemo(() => {
        return profile.full_name.trim() !== '' && profile.blood_type !== '';
      }, [profile]);

      return (
        <div class="min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* Toast Notification Banner */}
          {toast && (
            <div class={`fixed top-4 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-lg shadow-xl border text-sm font-medium transition-all duration-300 ${
              toast.type === 'error' ? 'bg-red-950 border-red-800 text-red-200' :
              toast.type === 'info' ? 'bg-cyan-950 border-cyan-800 text-cyan-200' :
              'bg-emerald-950 border-emerald-800 text-emerald-200'
            }`}>
              {toast.type === 'error' ? <Icons.AlertCircle /> : <Icons.CheckCircle />}
              <span>{toast.message}</span>
            </div>
          )}

          {/* Top Header */}
          <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div class="flex items-center justify-between h-16">
                
                {/* Logo & Branding */}
                <div class="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                  <div class="p-2 rounded-xl bg-cyan-500/10 border border-cyan-500/20 text-cyan-400">
                    <Icons.Shield />
                  </div>
                  <div>
                    <span class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
                      DIROA <span class="text-cyan-400 font-light">HEALTH</span>
                    </span>
                    <span class="text-[10px] uppercase tracking-widest text-slate-400 block -mt-1 font-semibold">
                      diroa.com
                    </span>
                  </div>
                </div>

                {/* Navigation Tabs */}
                <nav class="hidden md:flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-slate-800">
                  {[
                    { id: 'dashboard', label: 'Dashboard', icon: Icons.User },
                    { id: 'profile', label: 'Health Profile Editor', icon: Icons.FileText },
                    { id: 'card', label: 'Emergency ID Card', icon: Icons.QrCode },
                    { id: 'vault', label: 'Medical Vault', icon: Icons.Folder }
                  ].map((tab) => {
                    const Icon = tab.icon;
                    const isActive = activeTab === tab.id;
                    return (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        class={`flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all ${
                          isActive 
                            ? 'bg-cyan-500 text-slate-950 font-semibold shadow-md shadow-cyan-500/20' 
                            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                        }`}
                      >
                        <Icon />
                        {tab.label}
                      </button>
                    );
                  })}
                </nav>

                {/* Session Status / Auth Controls */}
                <div class="flex items-center gap-3">
                  <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-400">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Live Cloud Sync</span>
                  </div>

                  {user ? (
                    <div class="flex items-center gap-3 border-l border-slate-800 pl-3">
                      <div class="text-right hidden sm:block">
                        <div class="text-xs text-slate-400">Signed in as</div>
                        <div class="text-xs font-mono font-medium text-cyan-300 max-w-[140px] truncate">{user.email}</div>
                      </div>
                      <button 
                        onClick={handleSignOut}
                        class="p-2 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white transition-colors"
                        title="Sign Out"
                      >
                        <Icons.LogOut />
                      </button>
                    </div>
                  ) : (
                    <div class="flex items-center gap-2">
                      <button
                        onClick={() => { setAuthMode('signin'); setAuthModalOpen(true); }}
                        class="px-3 py-1.5 text-sm font-medium text-slate-300 hover:text-white transition-colors"
                      >
                        Sign In
                      </button>
                      <button
                        onClick={() => { setAuthMode('signup'); setAuthModalOpen(true); }}
                        class="px-3.5 py-1.5 text-sm font-medium bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-lg shadow-sm font-semibold transition-all"
                      >
                        Create Account
                      </button>
                    </div>
                  )}
                </div>

              </div>
            </div>

            {/* Mobile Tab Navigation */}
            <div class="md:hidden flex overflow-x-auto border-t border-slate-800 bg-slate-950 px-2 py-1.5 gap-1">
              {[
                { id: 'dashboard', label: 'Dashboard', icon: Icons.User },
                { id: 'profile', label: 'Profile Editor', icon: Icons.FileText },
                { id: 'card', label: 'Emergency Card', icon: Icons.QrCode },
                { id: 'vault', label: 'Vault', icon: Icons.Folder }
              ].map((tab) => {
                const Icon = tab.icon;
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    class={`flex items-center gap-1.5 whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium ${
                      isActive 
                        ? 'bg-cyan-500 text-slate-950 font-semibold' 
                        : 'text-slate-400 hover:bg-slate-900'
                    }`}
                  >
                    <Icon />
                    {tab.label}
                  </button>
                );
              })}
            </div>
          </header>

          {/* Main Content Viewport */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {activeTab === 'dashboard' && (
              <DashboardView 
                profile={profile} 
                isComplete={isProfileComplete} 
                setActiveTab={setActiveTab}
                user={user}
                setAuthModalOpen={setAuthModalOpen}
              />
            )}

            {activeTab === 'profile' && (
              <ProfileEditorView 
                profile={profile} 
                setProfile={setProfile} 
                handleSaveProfile={handleSaveProfile}
                savingProfile={savingProfile}
                user={user}
              />
            )}

            {activeTab === 'card' && (
              <EmergencyCardView 
                profile={profile} 
                isComplete={isProfileComplete}
                setActiveTab={setActiveTab}
              />
            )}

            {activeTab === 'vault' && (
              <MedicalVaultView 
                vaultDocs={vaultDocs} 
                setVaultDocs={setVaultDocs} 
                showToast={showToast}
              />
            )}
          </main>

          {}
          {authModalOpen && (
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
                <button 
                  onClick={() => setAuthModalOpen(false)}
                  class="absolute top-4 right-4 text-slate-400 hover:text-slate-200"
                >
                  ✕
                </button>

                <div class="flex items-center gap-2 mb-2 text-cyan-400 font-semibold">
                  <Icons.Shield />
                  <span>Diroa Health Security</span>
                </div>

                <h2 class="text-xl font-bold text-white mb-1">
                  {authMode === 'signup' ? 'Create your profile account' : 'Sign in to your account'}
                </h2>
                <p class="text-slate-400 text-xs mb-6">
                  {authMode === 'signup' 
                    ? 'Store your encrypted medical profile safely in the cloud.' 
                    : 'Access your saved medical intake forms and emergency cards.'}
                </p>

                {authError && (
                  <div class="mb-4 p-3 bg-red-950/60 border border-red-800/80 rounded-lg text-xs text-red-300">
                    {authError}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} class="space-y-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                    <input 
                      type="email" 
                      required
                      placeholder="name@domain.com" 
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                    />
                  </div>

                  <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                    <input 
                      type="password" 
                      required
                      placeholder="••••••••" 
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    class="w-full py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm transition-all shadow-md shadow-cyan-500/20 disabled:opacity-50"
                  >
                    {authLoading ? 'Processing...' : (authMode === 'signup' ? 'Create Account' : 'Sign In')}
                  </button>
                </form>

                <div class="mt-6 text-center text-xs text-slate-400 border-t border-slate-800/80 pt-4">
                  {authMode === 'signup' ? (
                    <span>Already have an account? <button onClick={() => { setAuthMode('signin'); setAuthError(''); }} class="text-cyan-400 hover:underline font-medium">Sign In</button></span>
                  ) : (
                    <span>Don't have an account? <button onClick={() => { setAuthMode('signup'); setAuthError(''); }} class="text-cyan-400 hover:underline font-medium">Create Account</button></span>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="border-t border-slate-900 bg-slate-950 py-6 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-600">
              <p>© 2026 Diroa Health Inc. (diroa.com) — Blank Medical Intake & Emergency ID Portal.</p>
              <p class="mt-1 text-slate-700">All data stored directly in your Supabase backend or local browser session. Zero mock text.</p>
            </div>
          </footer>
        </div>
      );
    }

    function DashboardView({ profile, isComplete, setActiveTab, user, setAuthModalOpen }) {
      // Calculate active metrics
      const activeMedicationsCount = useMemo(() => {
        if (!profile.medications.trim()) return 0;
        return profile.medications.split(',').filter(i => i.trim()).length;
      }, [profile.medications]);

      const allergiesCount = useMemo(() => {
        if (!profile.allergies.trim()) return 0;
        return profile.allergies.split(',').filter(i => i.trim()).length;
      }, [profile.allergies]);

      return (
        <div class="space-y-6">
          {/* Header Banner */}
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gradient-to-r from-slate-900 via-slate-900 to-cyan-950/30 p-6 rounded-2xl border border-slate-800">
            <div>
              <h1 class="text-2xl font-bold text-white">Health Profile Summary</h1>
              <p class="text-slate-400 text-sm mt-1">
                {user ? `Connected Account: ${user.email}` : 'Guest Session — Fill out your blank intake form to build your emergency card.'}
              </p>

                  <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500">Patient Name</span>
                  <h2 class="text-2xl font-black text-white">{profile.full_name || 'N/A'}</h2>
                  <div class="text-xs text-slate-400 mt-0.5">
                    DOB: {profile.dob || 'Unspecified'} • Gender: {profile.gender || 'N/A'}
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                  <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                    <span class="text-[10px] uppercase font-bold text-cyan-400 block">Blood Group</span>
                    <span class="text-xl font-extrabold text-white">{profile.blood_type || 'N/A'}</span>
                  </div>

                  <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800">
                    <span class="text-[10px] uppercase font-bold text-slate-400 block">Emergency Contact</span>
                    <span class="text-sm font-semibold text-slate-200 block truncate">{profile.emergency_name || 'N/A'}</span>
                    <span class="text-xs text-slate-400 font-mono">{profile.emergency_phone || 'No Phone'}</span>
                  </div>
                </div>

                <div class="space-y-2 pt-2 text-xs">
                  <div>
                    <span class="font-bold text-slate-400 block">Allergies:</span>
                    <span class="text-amber-300 font-medium">{profile.allergies || 'None declared'}</span>
                  </div>

                  <div>
                    <span class="font-bold text-slate-400 block">Active Medications:</span>
                    <span class="text-slate-300">{profile.medications || 'None listed'}</span>
                  </div>

                  {profile.physician_name && (
                    <div>
                      <span class="font-bold text-slate-400 block">Physician:</span>
                      <span class="text-slate-300">{profile.physician_name} ({profile.physician_phone})</span>
                    </div>
                  )}
                </div>
              </div>

              {/* Scannable QR Code */}
              <div class="flex flex-col items-center justify-center p-4 bg-white rounded-2xl shadow-inner text-center">
                <img 
                  src={qrUrl} 
                  alt="Emergency Medical QR Code" 
                  class="w-36 h-36 object-contain"
                />
                <span class="text-[10px] font-bold text-slate-900 mt-2 uppercase tracking-wider">
                  Scan for Medical Data
                </span>
              </div>

            </div>

            {/* Card Footer */}
            <div class="mt-6 pt-4 border-t border-slate-800 flex items-center justify-between text-[10px] text-slate-500">
              <span>Verified Diroa Emergency Protocol</span>
              <span>Hospital: {profile.preferred_hospital || 'Any Nearest Facility'}</span>
            </div>
          </div>
        </div>
      );
    }

    function MedicalVaultView({ vaultDocs, setVaultDocs, showToast }) {
      const [docTitle, setDocTitle] = useState('');
      const [docCategory, setDocCategory] = useState('Lab Result');

      const handleAddDocument = (e) => {
        e.preventDefault();
        if (!docTitle.trim()) return;

        const newDoc = {
          id: Date.now(),
          title: docTitle,
          category: docCategory,
          date: new Date().toLocaleDateString(),
          size: '1.2 MB'
        };

        setVaultDocs([newDoc, ...vaultDocs]);
        setDocTitle('');
        showToast('Document record added to vault!', 'success');
      };

      return (
        <div class="space-y-6">
          <div class="border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold text-white">Medical Vault</h1>
            <p class="text-slate-400 text-xs mt-1">
              Organize and attach official prescriptions, blood tests, and medical records.
            </p>
          </div>

          {/* Document Upload Area */}
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
            <h3 class="text-base font-semibold text-white mb-4">Add Document Record</h3>
            
            <form onSubmit={handleAddDocument} class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="sm:col-span-2">
                <label class="block text-xs font-medium text-slate-300 mb-1">Document Title / Description</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Annual Blood Panel Results 2026"
                  value={docTitle}
                  onChange={(e) => setDocTitle(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                />
              </div>

              <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
                <select
                  value={docCategory}
                  onChange={(e) => setDocCategory(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3.5 py-2 text-sm text-slate-100 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500"
                >
                  <option value="Lab Result">Lab Result</option>
                  <option value="Prescription">Prescription</option>
                  <option value="Imaging / X-Ray">Imaging / X-Ray</option>
                  <option value="Vaccination">Vaccination</option>
                  <option value="Insurance Claim">Insurance Claim</option>
                </select>
              </div>

              <div class="sm:col-span-3 flex justify-end">
                <button
                  type="submit"
                  class="px-5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs shadow-md transition-all flex items-center gap-1.5"
                >
                  <Icons.Plus />
                  Add Document
                </button>
              </div>
            </form>
          </div>

          {/* Document Vault List */}
          {vaultDocs.length === 0 ? (
            <div class="bg-slate-900/50 border-2 border-dashed border-slate-800 rounded-2xl p-12 text-center space-y-3">
              <Icons.Upload />
              <h3 class="text-base font-semibold text-slate-200">No documents uploaded yet</h3>
              <p class="text-slate-500 text-xs max-w-sm mx-auto">
                Your medical vault is currently empty. Use the input form above to catalog your health documents.
              </p>
            </div>
          ) : (
            <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-6 py-4 border-b border-slate-800 font-semibold text-sm text-white">
                Cataloged Records ({vaultDocs.length})
              </div>
              <div class="divide-y divide-slate-800">
                {vaultDocs.map((doc) => (
                  <div key={doc.id} class="p-4 flex items-center justify-between hover:bg-slate-800/40 transition-colors">
                    <div class="flex items-center gap-3">
                      <div class="p-2 rounded-lg bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                        <Icons.FileText />
                      </div>
                      <div>
                        <div class="font-semibold text-sm text-slate-200">{doc.title}</div>
                        <div class="text-xs text-slate-500 mt-0.5">
                          Category: <span class="text-cyan-400">{doc.category}</span> • Added: {doc.date}
                        </div>
                      </div>
                    </div>

                    <button 
                      onClick={() => setVaultDocs(vaultDocs.filter(d => d.id !== doc.id))}
                      class="text-xs text-slate-500 hover:text-red-400 transition-colors"
                    >
                      Remove
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
