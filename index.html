    // =========================================================================
    // 2b. ACCOUNT TYPES & VERIFICATION HELPERS
    // =========================================================================

    const ACCOUNT_TYPES = [
      { id: 'patient', label: 'Patient', hint: 'Patients get instant access. No verification needed.' },
      { id: 'provider', label: 'Provider', hint: 'Providers submit their license details and are verified before gaining full access.' },
      { id: 'institution', label: 'Institution', hint: 'Institutions submit their name, type and address and are verified before gaining full access.' }
    ];

    const INSTITUTION_TYPES = [
      'Hospital',
      'Clinic / Medical Practice',
      'Pharmacy',
      'Laboratory / Imaging Center',
      'Emergency / Urgent Care',
      'Other'
    ];

    const EMPTY_CREDENTIALS = {
      specialty: '',
      licenseNumber: '',
      licenseRegion: '',
      npiNumber: '',
      institutionName: '',
      institutionType: '',
      institutionAddress: ''
    };

    // Form field name -> profiles table column
    const CREDENTIAL_COLUMNS = {
      specialty: 'specialty',
      licenseNumber: 'license_number',
      licenseRegion: 'license_region',
      npiNumber: 'npi_number',
      institutionName: 'institution_name',
      institutionType: 'institution_type',
      institutionAddress: 'institution_address'
    };

    // Which credential fields each account type uses
    const CREDENTIAL_FIELDS = {
      provider: ['specialty', 'licenseNumber', 'licenseRegion', 'npiNumber'],
      institution: ['institutionName', 'institutionType', 'institutionAddress']
    };

    // Everything except the optional NPI number is required
    const REQUIRED_CREDENTIALS = {
      provider: ['specialty', 'licenseNumber', 'licenseRegion'],
      institution: ['institutionName', 'institutionType', 'institutionAddress']
    };

    function requiresVerification(accountType) {
      return accountType === 'provider' || accountType === 'institution';
    }

    // Trimmed credentials for the given account type (used at registration)
    function cleanCredentials(creds, accountType) {
      const cleaned = {};
      (CREDENTIAL_FIELDS[accountType] || []).forEach((key) => {
        cleaned[key] = (creds?.[key] ?? '').toString().trim();
      });
      return cleaned;
    }

    // Form values -> profiles table columns (empty values become null)
    function credentialsToColumns(creds, accountType) {
      const columns = {};
      (CREDENTIAL_FIELDS[accountType] || []).forEach((key) => {
        const value = (creds?.[key] ?? '').toString().trim();
        columns[CREDENTIAL_COLUMNS[key]] = value || null;
      });
      return columns;
    }

    // profiles table row -> form values
    function columnsToCredentials(row) {
      const creds = { ...EMPTY_CREDENTIALS };
      Object.keys(CREDENTIAL_COLUMNS).forEach((key) => {
        creds[key] = row?.[CREDENTIAL_COLUMNS[key]] || '';
      });
      return creds;
    }


    // Value stored in profiles.full_name. Institutions have no representative,
    // so their name is the institution's name.
    function getSignupFullName(meta, accountType) {
      if (accountType === 'institution') {
        return (meta?.credentials?.institutionName || meta?.full_name || '').toString().trim();
      }
      return (meta?.full_name || '').toString();
    }


    // =========================================================================
    // 3. AUTHENTICATION HELPERS
    // =========================================================================

    async function handleSignUp(email, password, fullName, accountType = 'patient', credentials = {}) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            account_type: accountType,
            ...(requiresVerification(accountType)
              ? { credentials: cleanCredentials(credentials, accountType) }
              : {})
          }
        }
      });

      if (error) {
        alert('Registration Error: ' + error.message);
        return false;
      }

      // With email confirmation on, Supabase reports success for an email that
      // is already registered but changes nothing (no new account type, no new
      // details). Say so instead of pretending a new account was created.
      if (Array.isArray(data?.user?.identities) && data.user.identities.length === 0) {
        alert('An account with this email already exists, so nothing was created or changed. Sign in with that account, or register with a different email address.');
        return false;
      }

      alert(
        requiresVerification(accountType)
          ? 'Account registered! Your details will be reviewed. Once any email confirmation is complete you can sign in, and full access unlocks after you are verified.'
          : 'Account registered! If email confirmation is enabled, check your inbox.'
      );
      return true;
    }

    async function handleLogin(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert('Login Error: ' + error.message);
        return null;
      }

      return data.user;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
    }


    // =========================================================================
    // 4. PROFILE DATABASE HELPERS
    // =========================================================================

    async function fetchUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.error('Error fetching profile:', error.message);
      }

      return data;
    }

    // Creates the profile row the first time an account signs in, using the
    // account type and credentials supplied at registration. Verification
    // status is NOT sent from the browser: the database sets it.
    async function createInitialProfile(authUser) {
      const meta = authUser.user_metadata || {};
      const type = ACCOUNT_TYPES.some((t) => t.id === meta.account_type) ? meta.account_type : 'patient';

      const payload = {
        id: authUser.id,
        email: authUser.email,
        full_name: getSignupFullName(meta, type),
        account_type: type,
        ...(requiresVerification(type) ? credentialsToColumns(meta.credentials || {}, type) : {}),
        updated_at: new Date().toISOString()
      };

      const { error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id', ignoreDuplicates: true });

      if (error) {
        console.error('Error creating profile:', error.message);
        return null;
      }

      return fetchUserProfile(authUser.id);
    }

    // If a profile row already exists but was created without the account type
    // the user chose at sign-up (for example by a database sign-up trigger, or
    // before the account-type columns existed), apply that choice now. The
    // database then puts the account into "pending" verification. It never
    // grants "verified".
    async function applySignupAccountType(authUser, profile) {
      const meta = authUser.user_metadata || {};
      const signupType = meta.account_type;

      if (!requiresVerification(signupType) || (profile.account_type || 'patient') !== 'patient') {
        return profile;
      }

      const { error } = await supabase
        .from('profiles')
        .update({
          account_type: signupType,
          full_name: getSignupFullName(meta, signupType) || profile.full_name || '',
          ...credentialsToColumns(meta.credentials || {}, signupType),
          updated_at: new Date().toISOString()
        })
        .eq('id', authUser.id);

      if (error) {
        console.error('Could not apply the account type chosen at sign-up:', error.message);
        return profile;
      }

      return (await fetchUserProfile(authUser.id)) || profile;
    }

    async function saveUserProfile(userId, profileData) {
      const payload = {
        id: userId,
        ...profileData,
        updated_at: new Date().toISOString()
      };

      const { data, error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

      if (error) {
        alert('Error saving profile: ' + error.message);
        return false;
      }

      return true;
    }

    // Each user has one stable avatar object. The bucket is public so profile
    // photos can appear in search results, messages, and shared-profile views.
    // Upload and delete permissions are restricted to that user's own folder.
    function getProfilePhotoPublicUrl(userId, cacheKey = 'profile') {
      if (!userId) return '';
      const { data } = supabase.storage
        .from(PROFILE_PHOTO_BUCKET)
        .getPublicUrl(`${userId}/avatar`);
      if (!data?.publicUrl) return '';
      return `${data.publicUrl}?v=${encodeURIComponent(cacheKey || 'profile')}`;

        .from('profile_directory')

    async function fetchMessagesBetweenUsers(userId, otherUserId, afterTimestamp) {
      let query = supabase
        .from('messages')
        .select('id, sender_id, recipient_id, body, created_at')
        .or(`and(sender_id.eq.${userId},recipient_id.eq.${otherUserId}),and(sender_id.eq.${otherUserId},recipient_id.eq.${userId})`)
        .order('created_at', { ascending: true })
        .limit(500);

      if (afterTimestamp) {
        query = query.gt('created_at', afterTimestamp);
      }

      const { data, error } = await query;

      if (error) {
        console.error('Conversation load error:', error.message);
        throw error;
      }

      return data || [];
    }

    // "Delete chat" never deletes a message: it records, for the current user
    // only, that everything up to this moment should be hidden. The other
    // participant keeps their full history, and if they send a new message
    // afterward the conversation reappears with just the new messages.
    async function fetchMessageDeletions(userId) {
      const { data, error } = await supabase
        .from('message_deletions')
        .select('other_user_id, cleared_at')
        .eq('user_id', userId);

      if (error) {
        console.error('Message deletions fetch error:', error.message);
        return {};
      }

      const map = {};
      (data || []).forEach((row) => { map[row.other_user_id] = row.cleared_at; });
      return map;
    }

    async function fetchClearedAt(userId, otherUserId) {
      const { data, error } = await supabase
        .from('message_deletions')
        .select('cleared_at')
        .eq('user_id', userId)
        .eq('other_user_id', otherUserId)
        .maybeSingle();

      if (error) {
        console.error('Cleared-at fetch error:', error.message);
        return null;
      }

      return data?.cleared_at || null;
    }

    async function clearConversationForUser(userId, otherUserId) {
      const { error } = await supabase
        .from('message_deletions')
        .upsert(
          { user_id: userId, other_user_id: otherUserId, cleared_at: new Date().toISOString() },
          { onConflict: 'user_id,other_user_id' }
        );

      if (error) {
        console.error('Clear conversation error:', error.message);
        throw error;
      }
    }

    async function insertMessage(senderId, recipientId, body) {
      const cleanBody = (body || '').trim();

      if (!senderId || !recipientId || !cleanBody) {
        return null;
      }

      const { data, error } = await supabase
        .from('messages')
        .insert({
          sender_id: senderId,
          recipient_id: recipientId,
          body: cleanBody
        })
        .select('id, sender_id, recipient_id, body, created_at')
        .single();

      if (error) {
        console.error('Send message error:', error.message);
        throw error;
      }

      return data;
    }

    // Health-profile fields that are shared. Keys match the profiles columns

    const SHARED_PROFILE_FIELDS = [
      { key: 'full_name', label: 'Full Name' },

      { key: 'blood_type', label: 'Blood Type' },

    function formatSharedValue(value) {
      if (Array.isArray(value)) {
        const items = value.map((item) => (item ?? '').toString().trim()).filter(Boolean);
        return items.length ? items.join(', ') : 'Not provided';
      }

      if (value === null || value === undefined) return 'Not provided';

      const text = value.toString().trim();
      return text || 'Not provided';
    }

    function isVerifiedShareRecipient(profile) {
      return Boolean(
        profile &&
        (profile.account_type === 'provider' || profile.account_type === 'institution') &&
        profile.verification_status === 'verified'
      );
    }

    function getAccountTypeLabel(type) {
      if (type === 'provider') return 'Healthcare Provider';
      if (type === 'institution') return 'Institution';
      return 'Patient';
    }

    function describeSharingError(error, fallback) {
      const code = error?.code || '';
      const message = error?.message || '';

      if (
        ['42P01', '42883', 'PGRST202', 'PGRST205'].includes(code) ||
        /could not find the (function|table)|schema cache|relation .*profile_shares.* does not exist/i.test(message)
      ) {
        return 'Profile sharing is not set up in the database yet. Run diroa-profile-sharing.sql in the Supabase SQL Editor, then reload this page.';
      }

      return message || fallback;
    }

    // The patient's active shares, with each recipient's directory profile
    async function fetchMyProfileShares(userId) {
      const { data, error } = await supabase
        .from('profile_shares')
        .select('id, recipient_id, status, patient_confirmed_at')
        .eq('patient_id', userId)
        .eq('status', 'active')
        .order('patient_confirmed_at', { ascending: false });

      if (error) {
        console.error('Profile shares fetch error:', error.message);
        throw error;
      }

      const rows = data || [];
      let profileMap = {};

      try {
        const profiles = await fetchProfilesByIds(rows.map((row) => row.recipient_id));
        profiles.forEach((profile) => { profileMap[profile.id] = profile; });
      } catch (lookupError) {
        profileMap = {};
      }

      return rows.map((row) => ({
        ...row,
        profile: profileMap[row.recipient_id] || null
      }));
    }

    // Vault uploads are named "<random id>-<original name>"; show the original

    function displayVaultFileName(name) {
      const clean = (name || '').replace(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-/i, '');

    // Files directly inside one vault folder (folder = the owner's user ID)
    async function fetchVaultFolderFiles(folderId) {
      const { data, error } = await supabase
        .storage
        .from(STORAGE_BUCKET)
        .list(folderId, {
          limit: 100,
          offset: 0,
          sortBy: { column: 'created_at', order: 'desc' }
        });

      if (error) {
        console.error('Vault folder list error:', error.message);
        throw error;
      }

      return (data || [])
        .filter((file) => file.name && file.id && file.name !== '.emptyFolderPlaceholder')
        .map((file) => ({ ...file, path: `${folderId}/${file.name}` }));
    }

    // A patient's vault files, for a verified recipient of an active share.
    // The access check runs first so a missing database setup or an ended
    // share is reported clearly instead of looking like an empty vault.
    async function fetchSharedVaultFiles(patientId) {
      const { data: allowed, error } = await supabase.rpc('can_view_shared_vault', {
        p_patient_folder: patientId
      });

      if (error) {
        console.error('Shared vault access check error:', error.message);
        throw error;
      }

      if (!allowed) {
        const denied = new Error('This patient is no longer sharing their documents with you.');
        denied.code = 'NOT_SHARED';
        throw denied;
      }

      return fetchVaultFolderFiles(patientId);
    }

    // Verified providers / institutions with an active share can edit the

    const BLOOD_TYPE_OPTIONS = ['A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'];

    function isBloodTypeVerified(profile) {
      return Boolean(profile?.blood_type && profile?.blood_type_verified_at);
    }

    // e.g. "Verified by Dr. Lin · Oct 22, 2026"
    function describeBloodTypeVerification(profile) {
      if (!profile?.blood_type) return '';
      if (!isBloodTypeVerified(profile)) return 'Unverified';

      const when = new Date(profile.blood_type_verified_at).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric'
      });
      return `Verified by ${profile.blood_type_verified_by_name || 'a verified provider'} · ${when}`;
    }

    function listFromValue(value) {
      if (Array.isArray(value)) {
        return value.map((item) => (item ?? '').toString().trim()).filter(Boolean);
      }
      return (value ?? '').toString().split(',').map((item) => item.trim()).filter(Boolean);
    }

    function getSharedFieldLabel(key) {
      return SHARED_PROFILE_FIELDS.find((field) => field.key === key)?.label || key;
    }

    // Attachment messages are stored in the existing messages.body field with
    // a recognizable prefix. Plain-text messages continue to use the original
    // format and require no database schema changes.
    function parseMessageAttachment(body) {
      const value = String(body || '');
      if (!value.startsWith(MESSAGE_ATTACHMENT_MARKER)) return null;
      try {
        const attachment = JSON.parse(value.slice(MESSAGE_ATTACHMENT_MARKER.length));
        if (!attachment || typeof attachment.path !== 'string' || typeof attachment.name !== 'string') return null;
        return attachment;
      } catch (error) {
        return null;
      }
    }

    function formatMessageFileSize(bytes) {
      const size = Number(bytes);
      if (!Number.isFinite(size) || size < 0) return '';
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / (1024 * 1024)).toFixed(1)} MB`;
    }

      function conversationListsEqual(a, b) {
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
          if (
            a[i].userId !== b[i].userId ||
            a[i].latestAt !== b[i].latestAt ||
            a[i].latestMessage !== b[i].latestMessage
          ) {
            return false;
          }
        }
        return true;
      }

      function messagesEqual(a, b) {
        if (a.length !== b.length) return false;
        for (let i = 0; i < a.length; i++) {
          if (a[i].id !== b[i].id) return false;
        }
        return true;

      React.useEffect(() => {
        if (!user || !canUseApp || activeTab !== 'messages') {
          return;

        let cancelled = false;

        async function loadConversations(isInitial) {
          if (isInitial) setConversationsLoading(true);
          setMessageError('');

          try {
            const [rows, clearedMap] = await Promise.all([
              fetchConversationRows(user.id),
              fetchMessageDeletions(user.id)
            ]);
            if (cancelled) return;

            const latestByUser = {};
            rows.forEach((row) => {
              const otherId = row.sender_id === user.id ? row.recipient_id : row.sender_id;
              if (!otherId || latestByUser[otherId]) return;

              const clearedAt = clearedMap[otherId];
              if (clearedAt && new Date(row.created_at) <= new Date(clearedAt)) return;

              latestByUser[otherId] = {
                userId: otherId,
                latestMessage: row.body,
                latestAt: row.created_at
              };
            });

            const ids = Object.keys(latestByUser);
            const profiles = await fetchProfilesByIds(ids);
            if (cancelled) return;

            const profileMap = {};
            profiles.forEach((profile) => {
              profileMap[profile.id] = profile;
            });

            const nextList = ids
              .map((id) => ({
                ...latestByUser[id],
                profile: profileMap[id] || { id, display_name: 'Unknown User' }
              }))
              .sort((a, b) => new Date(b.latestAt) - new Date(a.latestAt));

            setConversationProfiles(profileMap);
            setConversationList((previous) => (conversationListsEqual(previous, nextList) ? previous : nextList));

            const openId = activeConversationIdRef.current;
            if (openId) {
              const current = nextList.find((item) => item.userId === openId);
              if (current) {
                setActiveConversationProfile((previous) =>
                  previous &&
                  previous.id === current.profile.id &&
                  previous.display_name === current.profile.display_name &&
                  previous.verification_status === current.profile.verification_status
                    ? previous
                    : current.profile
                );
              }
            }
          } catch (error) {
            if (!cancelled && isInitial) {
              setConversationList([]);
              setConversationProfiles({});
              setMessageError(error?.message || 'Could not load your messages.');
            }
          } finally {
            if (!cancelled && isInitial) setConversationsLoading(false);
          }
        }

        const isInitial = !hasLoadedConversationsRef.current;
        hasLoadedConversationsRef.current = true;
        loadConversations(isInitial);
        const intervalId = window.setInterval(() => loadConversations(false), 6000);

        return () => {
          cancelled = true;
          window.clearInterval(intervalId);
        };

        setSharedUploadError('');
      }, [viewingSharedProfile?.patient_id]);

      function describeEditError(error, fallback) {
        const code = error?.code || '';
        const message = error?.message || '';

        if (['42883', 'PGRST202'].includes(code) || /could not find the function/i.test(message)) {
          return 'Editing is not set up in the database yet. Run the latest diroa-profile-sharing.sql in the Supabase SQL Editor, then reload this page.';
        }

        return message || fallback;
      }

      // Replace the open patient's data everywhere it is shown
      function applyUpdatedSharedProfile(patientId, profile) {
        if (!profile) return;

        setViewingSharedProfile((previous) =>
          previous && previous.patient_id === patientId ? { ...previous, profile } : previous
        );
        setSharedWithMe((previous) =>
          previous.map((row) => (row.patient_id === patientId ? { ...row, profile } : row))
        );
      }

      function startSharedEdit() {
        const entry = viewingSharedProfile;
        if (!entry || accountType === 'patient' || !canUseApp) return;

        const profile = entry.profile || {};

        setSharedEditBase(profile);
        setSharedEditForm({
          full_name: profile.full_name || '',
          age: profile.age === null || profile.age === undefined ? '' : String(profile.age),
          height: profile.height || '',
          weight: profile.weight || '',
          primary_doctor: profile.primary_doctor || '',
          allergies: listFromValue(profile.allergies).join(', '),
          medications: listFromValue(profile.medications).join(', '),
          medical_condition: profile.medical_condition || '',
          emergency_contact: profile.emergency_contact || '',
          blood_type: profile.blood_type || ''
        });
        setSharedEditError('');
        setSharedEditNotice('');
        setSharedEditMode(true);
      }

      function cancelSharedEdit() {
        if (sharedEditSaving) return;

        setSharedEditMode(false);
        setSharedEditBase(null);
        setSharedEditForm({});
        setSharedEditError('');
      }

      function updateSharedEditField(key, value) {
        setSharedEditForm((previous) => ({ ...previous, [key]: value }));
        if (sharedEditError) setSharedEditError('');
      }

      // Bring a new success / error message into view at the top of the pop-up
      React.useEffect(() => {
        if (!sharedModalRef.current || sharedEditMode) return;
        if (sharedEditNotice || sharedEditError) {
          sharedModalRef.current.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }, [sharedEditNotice, sharedEditError, sharedEditMode]);

      // Only the fields the editor actually changed are sent, so nothing else
      // in the patient's profile is touched.
      function buildSharedProfileChanges(base, form) {
        const changes = {};
        const textFields = ['full_name', 'height', 'weight', 'primary_doctor', 'medical_condition', 'emergency_contact'];

        textFields.forEach((key) => {
          const next = (form[key] ?? '').toString().trim();
          const before = (base[key] ?? '').toString().trim();
          if (next !== before) changes[key] = next;
        });

        const nextAge = (form.age ?? '').toString().trim();
        const beforeAge = base.age === null || base.age === undefined ? '' : String(base.age).trim();
        if (nextAge !== beforeAge) changes.age = nextAge;

        ['allergies', 'medications'].forEach((key) => {
          const next = listFromValue(form[key]);
          const before = listFromValue(base[key]);
          if (JSON.stringify(next) !== JSON.stringify(before)) changes[key] = next;
        });

        if ((form.blood_type || '') !== (base.blood_type || '')) {
          changes.blood_type = form.blood_type || '';
        }

        return changes;
      }

      async function handleSaveSharedEdit(e) {
        if (e) e.preventDefault();

        const entry = viewingSharedProfile;
        if (!user || !entry || !sharedEditBase || sharedEditSaving) return;

        const changes = buildSharedProfileChanges(sharedEditBase, sharedEditForm);
        const patientName = sharedEditBase.full_name || 'this patient';

        if (Object.keys(changes).length === 0) {
          setSharedEditError('You have not changed anything yet.');
          return;
        }

        if (changes.age && !/^\d{1,3}$/.test(changes.age)) {
          setSharedEditError('Age must be a whole number.');
          return;
        }

        if ('blood_type' in changes) {
          const confirmed = window.confirm(
            changes.blood_type
              ? `Set ${patientName}'s blood type to ${changes.blood_type}?\n\nIt will be shown as verified by you. Only continue if you have confirmed it (for example from a lab result).`
              : `Remove ${patientName}'s blood type?\n\nIt will show as "Not set" until a provider sets it again.`
          );
          if (!confirmed) return;
        }

        setSharedEditSaving(true);
        setSharedEditError('');
        setSharedEditNotice('');

        try {
          const profile = await updateSharedPatientProfile(entry.patient_id, changes, sharedEditBase.updated_at);
          applyUpdatedSharedProfile(entry.patient_id, profile);
          setSharedEditMode(false);
          setSharedEditBase(null);
          setSharedEditForm({});
          setSharedEditNotice(`Changes saved. ${patientName} can see what you changed in their sharing history.`);
        } catch (error) {
          const message = describeEditError(error, 'The changes could not be saved.');
          setSharedEditError(message);

          // Someone else changed the profile first: show the latest version.
          if (/changed since you opened it/i.test(message)) {
            setSharedEditMode(false);
            setSharedEditBase(null);
            setSharedEditForm({});
            loadSharedWithMe();
          }
        } finally {
          setSharedEditSaving(false);
        }
      }

      // Confirm the blood type already on file (e.g. one the patient entered
      // before verification was required)
      async function handleVerifySharedBloodType() {
        const entry = viewingSharedProfile;
        const profile = entry?.profile;
        if (!user || !profile?.blood_type || sharedEditSaving) return;

        const patientName = profile.full_name || 'this patient';
        const confirmed = window.confirm(
          `Verify that ${patientName}'s blood type is ${profile.blood_type}?\n\nIt will be shown as verified by you. Only continue if you have confirmed it (for example from a lab result).`
        );
        if (!confirmed) return;

        setSharedEditSaving(true);
        setSharedEditError('');
        setSharedEditNotice('');

        try {
          const updated = await updateSharedPatientProfile(
            entry.patient_id, { blood_type: profile.blood_type }, profile.updated_at
          );
          applyUpdatedSharedProfile(entry.patient_id, updated);
          setSharedEditNotice(`Blood type ${profile.blood_type} is now verified by you.`);
        } catch (error) {
          const message = describeEditError(error, 'The blood type could not be verified.');
          setSharedEditError(message);
          if (/changed since you opened it/i.test(message)) loadSharedWithMe();
        } finally {

        }
      }

      // Delete a document from the sharing patient's vault (any file in it)
      async function handleDeleteSharedVaultFile(file) {
        const entry = viewingSharedProfile;
        if (!user || !entry?.patient_id || !file?.path || deletingSharedFile || sharedVaultUploading) return;

        const patientId = entry.patient_id;
        const patientName = entry.profile?.full_name || 'the patient';
        const fileName = displayVaultFileName(file.name);

        const confirmed = window.confirm(
          `Delete "${fileName}" from ${patientName}'s Medical Vault permanently?\n\nThis cannot be undone. ${patientName} will see that you deleted it in their sharing history.`
        );
        if (!confirmed) return;

        setDeletingSharedFile(file.path);
        setSharedUploadError('');
        setSharedUploadMessage('');

        try {
          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .remove([file.path]);

          // Storage reports success with nothing removed when access is denied
          if (error || !Array.isArray(data) || data.length === 0) {
            if (error) console.error('Shared vault delete error:', error);
            setSharedUploadError(
              error && !/row-level security|unauthorized|not authorized|permission/i.test(error.message || '')
                ? 'Could not delete the file: ' + error.message
                : 'This document could not be deleted. The patient may have stopped sharing, or the latest diroa-profile-sharing.sql has not been run yet.'
            );
            return;
          }

          setSharedVaultFiles((previous) => previous.filter((item) => item.path !== file.path));
          await logSharedVaultDelete(patientId, file.path, fileName);
          setSharedUploadMessage(`Deleted from ${patientName}'s vault: ${fileName}`);
        } catch (error) {
          console.error('Shared vault delete error:', error);
          setSharedUploadError('Something went wrong while deleting the file.');
        } finally {
          setDeletingSharedFile(null);
        }
      }

      // Returns the provider edit made since the patient's screen was loaded,
      // or null. If this cannot be checked, saving goes ahead as it always has.
      async function findProviderEditSinceLoad() {
        const marker = providerEditMarkerRef.current;
        if (!user || marker === undefined) return null;

          const latest = await fetchLatestProviderEdit(user.id);
          return latest && latest.id !== marker ? latest : null;

      // Stops a patient's out-of-date screen from silently erasing a change a
      // provider just made. Returns true if the save should stop.
      async function stopIfProviderEditedSinceLoad() {
        const providerEdit = await findProviderEditSinceLoad();
        if (!providerEdit) return false;

        alert(
          `${providerEdit.editor_name || 'A provider you share with'} updated your health profile since you opened this page.\n\n` +
          'So their changes are not erased, the latest version has now been loaded. Please review it and make your changes again.'

      // =========================================================================
      // 9. LOAD PROFILE
      // =========================================================================

      async function loadProfile(userId, authUser) {
        try {
          let data = await fetchUserProfile(userId);

          // First sign-in for this account: create the profile row from the
          // details supplied at registration (account type + credentials).
          if (!data && authUser) {
            data = await createInitialProfile(authUser);
          }

          // The row may have been created without the account type chosen at
          // sign-up. Apply it now.
          if (data && authUser) {
            data = await applySignupAccountType(authUser, data);
          }

          const metadata = authUser?.user_metadata || {};
          const signupType = metadata.account_type;
          const rowType = data ? data.account_type : undefined;

          // The account signed up as a provider / institution, but the database
          // does not record that (missing columns, an out-of-date trigger, or a
          // profile that could not be created). Never show these accounts the
          // patient portal, and say what is wrong.
          const typeMismatch =
            requiresVerification(signupType) && (!data || rowType === undefined || rowType === 'patient');

          if (data && !typeMismatch) {
            setSetupIssue('');
            setUserProfile(data);
            setAccountType(data.account_type || 'patient');
            setVerificationStatus(data.verification_status || 'not_required');
            setVerificationNotes(data.verification_notes || '');
            setCredentials(columnsToCredentials(data));
            setFullName(data.full_name || '');
            setBloodType(data.blood_type || '');
            setAge(data.age || '');
            setHeight(data.height || '');
            setWeight(data.weight || '');
            setPrimaryDoctor(data.primary_doctor || '');
            setAllergies(Array.isArray(data.allergies) ? data.allergies.join(', ') : (data.allergies || ''));
            setMedications(Array.isArray(data.medications) ? data.medications.join(', ') : (data.medications || ''));
            setEmergencyContact(data.emergency_contact || '');
            setMedicalCondition(data.medical_condition || '');
          } else {
            // No usable profile, so fall back to the auth metadata.
            if (metadata.full_name && !fullName) {
              setFullName(metadata.full_name);
            }

            // Never fail open: accounts that need verification stay locked.
            if (requiresVerification(signupType)) {
              setAccountType(signupType);
              setVerificationStatus('pending');
              setVerificationNotes('');
              setCredentials({ ...EMPTY_CREDENTIALS, ...(metadata.credentials || {}) });

              const article = signupType === 'institution' ? 'an institution' : 'a provider';
              let issue;

              if (!data) {
                issue = 'Your profile could not be created or read from the database. Run diroa-account-types.sql (Part 1) in the Supabase SQL Editor, check the browser console for details, then reload this page.';
              } else if (rowType === undefined) {
                issue = 'Your database is missing the account-type columns. Run diroa-account-types.sql (Part 1) in the Supabase SQL Editor, then reload this page.';
              } else {
                issue = `This account signed up as ${article}, but your database still records it as a patient. Run diroa-account-types.sql (Part 1) in the Supabase SQL Editor to update it, then reload this page.`;
              }

              console.error(issue);
              setSetupIssue(issue);
            }
          }
        } finally {
          setProfileReady(true);
        }
      }


      // =========================================================================
      // 10. LOAD FILES FROM THE USER'S VAULT FOLDER
      // =========================================================================

      async function loadVaultFiles(userId) {
        if (!userId) return;

        setVaultLoading(true);
        setUploadError('');

        try {
          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .list(userId, {
              limit: 100,
              offset: 0,
              sortBy: { column: 'created_at', order: 'desc' }
            });

          if (error) {
            console.error('Vault list error:', error);

            if (error.message && error.message.toLowerCase().includes('bucket not found')) {
              setUploadError('The "medical-vault" bucket does not exist yet. Run the Supabase SQL setup provided above.');
            } else {
              setUploadError('Could not load your vault: ' + error.message);
            }

            setVaultFiles([]);
            return;
          }

          const files = (data || [])
            .filter(file => file.name)
            .map(file => ({ ...file, path: `${userId}/${file.name}` }));

          setVaultFiles(files);
        } catch (error) {
          console.error('Vault load error:', error);
          setUploadError('Could not load your vault files.');
        } finally {
          setVaultLoading(false);
        }
      }


      // Upload a new file directly into the patient's vault. RLS requires an active share with
      // a verified provider / institution; providers can never overwrite or rename existing files.
      async function handleSharedVaultUpload(file) {
        const patientId = viewingSharedProfile?.patient_id;
        if (!user || !patientId) {
          setSharedVaultUploadError('Open an active shared patient profile before uploading.');
          return;
        }
        if (!['provider', 'institution'].includes(accountType) || verificationStatus !== 'verified') {
          setSharedVaultUploadError('Only verified providers and institutions can contribute documents.');
          return;
        }
        if (!sharedVaultWriteAllowed) {
          setSharedVaultUploadError('Documents can only be added while the patient is sharing their profile with you.');
          return;
        }
        if (!file) return;

        const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg'];
        if (!allowedTypes.includes(file.type)) {
          setSharedVaultUploadError('Only PDF, PNG, and JPG files are allowed.');
          setSharedVaultUploadMessage('');
          if (sharedVaultUploadInputRef.current) sharedVaultUploadInputRef.current.value = '';
          return;
        }
        if (file.size > 25 * 1024 * 1024) {
          setSharedVaultUploadError('File is too large. Maximum size is 25MB.');
          setSharedVaultUploadMessage('');
          if (sharedVaultUploadInputRef.current) sharedVaultUploadInputRef.current.value = '';
          return;
        }

        setSharedVaultUploading(true);
        setSharedVaultUploadError('');
        setSharedVaultUploadMessage('');
        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const uniqueId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);
          const filePath = `${patientId}/${uniqueId}-${safeName}`;
          const { error } = await supabase.storage.from(STORAGE_BUCKET).upload(filePath, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type
          });
          if (error) throw error;

          // Record the upload in the patient's change history (best effort).
          try {
            await logSharedVaultUpload(patientId, filePath, file.name);
          } catch (logError) {
            console.error('Upload history error:', logError);
          }

          const files = await fetchSharedVaultFiles(patientId);
          setSharedVaultFiles(files);
          setSharedVaultUploadMessage(`Added ${file.name} to ${viewingSharedProfile?.profile?.full_name || 'the patient'}'s Medical Vault.`);
        } catch (error) {
          console.error('Shared patient vault upload error:', error);
          setSharedVaultUploadError(error?.message || 'Could not upload this document. Confirm the patient still shares their profile.');
        } finally {
          setSharedVaultUploading(false);
          if (sharedVaultUploadInputRef.current) sharedVaultUploadInputRef.current.value = '';
        }
      }

      async function handleSaveSharedPatientNote(event) {

      // =========================================================================
      // 11. UPLOAD FILE
      // =========================================================================

      async function handleVaultUpload(file) {
        if (!user) {
          setUploadError('You must be signed in to upload files.');
          return;
        }

        if (requiresVerification(accountType) && verificationStatus !== 'verified') {
          setUploadError('Your provider or institution account must be verified before uploading documents.');
          return;
        }

        if (!file) {
          return;
        }

        // Only allow medical document formats for now
        const allowedTypes = ['application/pdf', 'image/png', 'image/jpeg'];

        if (!allowedTypes.includes(file.type)) {
          setUploadError('Only PDF, PNG, and JPG files are allowed.');
          setUploadMessage('');
          if (fileInputRef.current) fileInputRef.current.value = '';
          return;
        }

        // 25 MB maximum
        const maxSize = 25 * 1024 * 1024;

        if (file.size > maxSize) {
          setUploadError('File is too large. Maximum size is 25MB.');
          setUploadMessage('');
          if (fileInputRef.current) fileInputRef.current.value = '';
          return;
        }

        setUploading(true);
        setUploadMessage('');
        setUploadError('');

        try {
          // Remove unsafe characters from the original filename
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');

          // Give every uploaded file a unique filename
          const uniqueId = crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36);

          // IMPORTANT: the first folder is the Supabase user ID.
          // This is what the Storage RLS policies use.
          const filePath = `${user.id}/${uniqueId}-${safeName}`;

          const { data, error } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .upload(filePath, file, {
              cacheControl: '3600',
              upsert: false,
              contentType: file.type
            });

          if (error) {
            console.error('Vault upload error:', error);

            if (error.message && error.message.toLowerCase().includes('bucket not found')) {
              setUploadError('Upload failed because the "medical-vault" bucket does not exist. Run the Supabase SQL setup above.');
            } else {
              setUploadError('Upload failed: ' + error.message);
            }

            return;
          }

          setUploadMessage(`Uploaded successfully: ${file.name}`);

          // Refresh the vault immediately
          await loadVaultFiles(user.id);
        } catch (error) {
          console.error('Vault upload error:', error);
          setUploadError('Something went wrong during the upload.');
        } finally {
          setUploading(false);
          if (fileInputRef.current) fileInputRef.current.value = '';
        }
      }

      async function handleSendMessageAttachment(event) {
        const input = event?.currentTarget;
        const file = input?.files?.[0];
        if (input) input.value = '';
        if (!file) return;

        if (!user || !activeConversationId) {
          setMessageError('Open a conversation before attaching a document.');
          return;
        }
        if (sendingMessage || sendingAttachment) return;

        const recipientId = activeConversationId;
        const caption = messageText.trim();
        const lastDot = file.name.lastIndexOf('.');
        const extension = lastDot >= 0 ? file.name.slice(lastDot).toLowerCase() : '';
        const contentType = MESSAGE_ATTACHMENT_MIME_BY_EXTENSION[extension];

        if (!contentType) {
          setMessageError('This file type is not supported. Use PDF, Word, text, CSV/Excel, PowerPoint, PNG, or JPG.');
          return;
        }
        if (file.size > MAX_MESSAGE_ATTACHMENT_SIZE) {
          setMessageError('The file is too large. Maximum attachment size is 25 MB.');
          return;
        }
        if (file.size === 0) {
          setMessageError('This file is empty. Choose a different file.');
          return;
        }

        setSendingAttachment(true);
        setMessageError('');
        let uploadedPath = '';

        try {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 160) || `attachment${extension}`;
          const uniqueId = (window.crypto && typeof window.crypto.randomUUID === 'function')
            ? window.crypto.randomUUID()
            : `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          // The first folder is the signed-in sender ID, matching the private
          // bucket's insert policy. The recipient gets access through the sent
          // message's attachment metadata, not through public bucket access.
          uploadedPath = `${user.id}/chat/${uniqueId}-${safeName}`;

          const { error: uploadError } = await supabase
            .storage
            .from(MESSAGE_ATTACHMENT_BUCKET)
            .upload(uploadedPath, file, {
              cacheControl: '3600',
              upsert: false,
              contentType
            });

          if (uploadError) throw uploadError;

          const attachmentBody = MESSAGE_ATTACHMENT_MARKER + JSON.stringify({
            path: uploadedPath,
            name: file.name,
            size: file.size,
            type: contentType,
            caption
          });
          const newMessage = await insertMessage(user.id, recipientId, attachmentBody);
          if (!newMessage) throw new Error('The file uploaded, but its message could not be created.');

          if (activeConversationIdRef.current === recipientId) {
            setConversationMessages((current) => [...current, newMessage]);
            window.setTimeout(() => {
              messagesEndRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 0);
          }
          if (messageText.trim() === caption) setMessageText('');
        } catch (error) {
          console.error('Message attachment send error:', error);
          if (uploadedPath) {
            try {
              await supabase.storage.from(MESSAGE_ATTACHMENT_BUCKET).remove([uploadedPath]);
            } catch (cleanupError) {
              console.warn('Could not clean up an unsent message attachment:', cleanupError);
            }
          }
          const detail = error?.message || 'Unknown upload error.';
          setMessageError(`Could not send the attachment: ${detail}. If the attachment bucket has not been set up yet, run diroa-messaging-attachments.sql in Supabase first.`);
        } finally {
          setSendingAttachment(false);
        }
      }

      async function handleDownloadMessageAttachment(attachment, senderId) {
        if (!user || !attachment?.path || !senderId) return;
        // Prevent message metadata from being used to request a signed link for
        // an unrelated file outside the sender's chat-attachment folder.
        if (!attachment.path.startsWith(`${senderId}/chat/`)) {
          setMessageError('This attachment link is invalid.');
          return;
        }

        setDownloadingMessageAttachmentPath(attachment.path);
        setMessageError('');
        // Open the tab synchronously from the click so browsers do not block it
        // while Supabase generates the short-lived, private download URL.
        const downloadWindow = window.open('about:blank', '_blank');

        try {
          const { data, error } = await supabase
            .storage
            .from(MESSAGE_ATTACHMENT_BUCKET)
            .createSignedUrl(attachment.path, 60 * 10);
          if (error) throw error;
          if (!data?.signedUrl) throw new Error('No download link was returned.');

          if (downloadWindow && !downloadWindow.closed) {
            downloadWindow.opener = null;
            downloadWindow.location.href = data.signedUrl;
          } else {
            const link = document.createElement('a');
            link.href = data.signedUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.download = attachment.name || '';
            document.body.appendChild(link);
            link.click();
            link.remove();
          }
        } catch (error) {
          if (downloadWindow && !downloadWindow.closed) downloadWindow.close();
          console.error('Message attachment download error:', error);
          setMessageError(error?.message || 'Could not open this attachment.');
        } finally {
          setDownloadingMessageAttachmentPath('');
        }
      }

      // One readable line per change in a history entry
      function describeEditLogEntry(entry) {
        const changes = entry?.changes || {};

        if (entry?.action === 'document_upload') {
          return [`Added document: ${changes.file_name || displayVaultFileName((changes.file_path || '').split('/').pop())}`];
        }

        if (entry?.action === 'document_delete') {
          return [`Deleted document: ${changes.file_name || displayVaultFileName((changes.file_path || '').split('/').pop())}`];
        }

        return Object.keys(changes).map((key) => {
          const change = changes[key] || {};
          const before = formatSharedValue(change.old);
          const after = formatSharedValue(change.new);

          if (key === 'blood_type') {
            if (!change.new) return `Removed blood type (was ${before})`;
            if (before === after) return `Verified blood type ${after}`;
            return `Blood Type: ${before} → ${after} (verified)`;
          }

          return `${getSharedFieldLabel(key)}: ${before} → ${after}`;
        });
      }

      function closeSharedProfile() {
        if (sharedEditSaving) return;

        if (sharedEditMode && sharedEditBase &&
            Object.keys(buildSharedProfileChanges(sharedEditBase, sharedEditForm)).length > 0 &&
            !window.confirm('Discard your unsaved changes to this profile?')) {
          return;
        }

        setViewingSharedProfile(null);
      }

        return (
          <form onSubmit={handleSaveSharedEdit} className="mt-5 space-y-4">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div className="sm:col-span-2">

                <input type="text" value={form.full_name || ''} onChange={(e) => updateSharedEditField('full_name', e.target.value)} className={inputClass} />

              <div>

                    <option key={type} value={type}>{type}</option>

              </div>
              <div>
                <label className={labelClass}>Height</label>
                <input type="text" value={form.height || ''} onChange={(e) => updateSharedEditField('height', e.target.value)} className={inputClass} />
              </div>
              <div>
                <label className={labelClass}>Weight</label>
                <input type="text" value={form.weight || ''} onChange={(e) => updateSharedEditField('weight', e.target.value)} className={inputClass} />
              </div>
              <div className="sm:col-span-2">
                <label className={labelClass}>Primary Doctor</label>
                <input type="text" value={form.primary_doctor || ''} onChange={(e) => updateSharedEditField('primary_doctor', e.target.value)} className={inputClass} />

              <div className="sm:col-span-2">
                <label className={labelClass}>Known Allergies <span className="text-slate-500">(separate with commas)</span></label>

                <label className={labelClass}>Current Medications <span className="text-slate-500">(separate with commas)</span></label>

              </div>

                <label className={labelClass}>Current Medical Condition / Diagnosis</label>

              <div className="sm:col-span-2">
                <label className={labelClass}>Emergency Contact</label>
                <input type="text" value={form.emergency_contact || ''} onChange={(e) => updateSharedEditField('emergency_contact', e.target.value)} className={inputClass} />

                {sharedEditSaving ? 'Saving...' : 'Save Changes'}

      function formatFileSize(bytes) {
        if (!bytes) return 'Unknown size';
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function formatFileDate(dateString) {
        if (!dateString) return '';
        return new Date(dateString).toLocaleString(undefined, {
          dateStyle: 'medium',
          timeStyle: 'short'
        });
      }

      function getFileIcon(fileName) {
        const extension = fileName.split('.').pop()?.toLowerCase();
        if (extension === 'pdf') return '📄';
        if (extension === 'png' || extension === 'jpg' || extension === 'jpeg') return '🖼️';
        return '📁';

                  >
                    {isSignUp ? (requiresVerification(authAccountType) ? 'Register & Submit for Verification' : 'Register Account') : 'Sign In'}
                  </button>
                </form>

                <div className="mt-4 text-center">
                  <button
                    type="button"
                    onClick={toggleAuthMode}
                    className="text-xs text-cyan-400 hover:underline"
                  >
                    {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Register"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
