<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Prevent Browser & CDN Caching of Old Versions -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Diroa Health Profiles</title>

  <!-- External CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">

    // =========================================================================
    // 1. SUPABASE CONFIGURATION
    // =========================================================================

    const SUPABASE_URL = 'https://ikzrbztopdmxhneloyim.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrenJienRvcGRteGhuZWxveWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzM0MDUsImV4cCI6MjEwNTk0OTQwNX0.yOtplAIElZrbdx-M-Cs12vE5Av6p8uBxiYY3IkHMCwA';

    const STORAGE_BUCKET = 'medical-vault';

    const supabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    // =========================================================================
    // 2. DIROA LOGO
    // =========================================================================
    // Using a small inline SVG here so the HTML stays manageable.
    // You can replace this constant with your original PNG data URI later.

    const DIROA_LOGO = `
      data:image/svg+xml;charset=UTF-8,
      <svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60">
        <rect width="240" height="60" rx="8" fill="#020617"/>
        <text x="120" y="39"
          text-anchor="middle"
          font-family="Courier New, monospace"
          font-size="29"
          font-weight="700"
          fill="#ffffff">
          DIROA
        </text>
      </svg>
    `.replace(/\s+/g, ' ');


    // =========================================================================
    // 3. AUTHENTICATION HELPERS
    // =========================================================================

    async function handleSignUp(email, password, fullName) {

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,

        options: {
          data: {
            full_name: fullName
          }
        }
      });

      if (error) {
        alert('Registration Error: ' + error.message);
        return false;
      }

      alert(
        'Account registered! If email confirmation is enabled, check your inbox.'
      );

      return true;
    }


    async function handleLogin(email, password) {

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        alert('Login Error: ' + error.message);
        return null;
      }

      return data.user;
    }


    async function handleLogout() {
      await supabase.auth.signOut();
    }


    // =========================================================================
    // 4. PROFILE DATABASE HELPERS
    // =========================================================================

    async function fetchUserProfile(userId) {

      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.error(
          'Error fetching profile:',
          error.message
        );
      }

      return data;
    }


    async function saveUserProfile(userId, profileData) {

      const payload = {
        id: userId,
        ...profileData,
        updated_at: new Date().toISOString()
      };

      const { data, error } = await supabase
        .from('profiles')
        .upsert(
          payload,
          {
            onConflict: 'id'
          }
        );

      if (error) {

        alert(
          'Error saving profile: ' +
          error.message
        );

        return false;
      }

      alert(
        'Health profile saved successfully!'
      );

      return true;
    }


    // =========================================================================
    // 5. MAIN REACT APPLICATION
    // =========================================================================

    function App() {

      // -----------------------------------------------------------------------
      // AUTH STATE
      // -----------------------------------------------------------------------

      const [user, setUser] =
        React.useState(null);

      const [userProfile, setUserProfile] =
        React.useState(null);

      const [loading, setLoading] =
        React.useState(true);

      const [activeTab, setActiveTab] =
        React.useState('dashboard');


      // -----------------------------------------------------------------------
      // AUTH MODAL
      // -----------------------------------------------------------------------

      const [showAuthModal, setShowAuthModal] =
        React.useState(false);

      const [isSignUp, setIsSignUp] =
        React.useState(false);

      const [authEmail, setAuthEmail] =
        React.useState('');

      const [authPassword, setAuthPassword] =
        React.useState('');

      const [authConfirmPassword, setAuthConfirmPassword] =
        React.useState('');

      const [authName, setAuthName] =
        React.useState('');

      const [authError, setAuthError] =
        React.useState('');


      // -----------------------------------------------------------------------
      // PROFILE FORM
      // -----------------------------------------------------------------------

      const [fullName, setFullName] =
        React.useState('');

      const [bloodType, setBloodType] =
        React.useState('');

      const [age, setAge] =
        React.useState('');

      const [height, setHeight] =
        React.useState('');

      const [weight, setWeight] =
        React.useState('');

      const [primaryDoctor, setPrimaryDoctor] =
        React.useState('');

      const [allergies, setAllergies] =
        React.useState('');

      const [medications, setMedications] =
        React.useState('');

      const [emergencyContact, setEmergencyContact] =
        React.useState('');

      const [saving, setSaving] =
        React.useState(false);


      // -----------------------------------------------------------------------
      // MEDICAL VAULT STATE
      // -----------------------------------------------------------------------

      const [uploading, setUploading] =
        React.useState(false);

      const [uploadMessage, setUploadMessage] =
        React.useState('');

      const [uploadError, setUploadError] =
        React.useState('');

      const [vaultFiles, setVaultFiles] =
        React.useState([]);

      const [vaultLoading, setVaultLoading] =
        React.useState(false);

      const [deletingFile, setDeletingFile] =
        React.useState(null);

      const fileInputRef =
        React.useRef(null);


      // =========================================================================
      // 6. INITIAL AUTH SESSION
      // =========================================================================

      React.useEffect(() => {

        supabase.auth
          .getSession()
          .then(
            ({
              data: {
                session
              }
            }) => {

              const currentUser =
                session?.user ?? null;

              setUser(currentUser);

              if (currentUser) {
                loadProfile(currentUser.id);
              }

              setLoading(false);
            }
          );


        const {
          data: {
            subscription
          }
        } =
          supabase.auth.onAuthStateChange(
            (_event, session) => {

              const currentUser =
                session?.user ?? null;

              setUser(currentUser);

              if (currentUser) {

                loadProfile(
                  currentUser.id
                );

              } else {

                setUserProfile(null);
                clearForm();
                setVaultFiles([]);

              }
            }
          );


        return () => {
          subscription.unsubscribe();
        };

      }, []);


      // =========================================================================
      // 7. LOAD VAULT FILES WHEN VAULT TAB IS OPEN
      // =========================================================================

      React.useEffect(() => {

        if (
          user &&
          activeTab === 'vault'
        ) {

          loadVaultFiles(
            user.id
          );
        }

      }, [activeTab, user]);


      // =========================================================================
      // 8. CLEAR PROFILE FORM
      // =========================================================================

      function clearForm() {

        setFullName('');
        setBloodType('');
        setAge('');
        setHeight('');
        setWeight('');
        setPrimaryDoctor('');
        setAllergies('');
        setMedications('');
        setEmergencyContact('');
      }


      // =========================================================================
      // 9. LOAD PROFILE
      // =========================================================================

      async function loadProfile(userId) {

        const data =
          await fetchUserProfile(
            userId
          );

        if (data) {

          setUserProfile(data);

          setFullName(
            data.full_name || ''
          );

          setBloodType(
            data.blood_type || ''
          );

          setAge(
            data.age || ''
          );

          setHeight(
            data.height || ''
          );

          setWeight(
            data.weight || ''
          );

          setPrimaryDoctor(
            data.primary_doctor || ''
          );

          setAllergies(
            Array.isArray(data.allergies)
              ? data.allergies.join(', ')
              : (data.allergies || '')
          );

          setMedications(
            Array.isArray(data.medications)
              ? data.medications.join(', ')
              : (data.medications || '')
          );

          setEmergencyContact(
            data.emergency_contact || ''
          );

        } else {

          // If there is no profile row yet,
          // use the user's auth metadata.

          const metadata =
            user?.user_metadata || {};

          if (
            metadata.full_name &&
            !fullName
          ) {
            setFullName(
              metadata.full_name
            );
          }
        }
      }


      // =========================================================================
      // 10. LOAD FILES FROM THE USER'S VAULT FOLDER
      // =========================================================================

      async function loadVaultFiles(userId) {

        if (!userId) return;

        setVaultLoading(true);
        setUploadError('');

        try {

          const {
            data,
            error
          } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .list(
              userId,
              {
                limit: 100,
                offset: 0,
                sortBy: {
                  column: 'created_at',
                  order: 'desc'
                }
              }
            );


          if (error) {

            console.error(
              'Vault list error:',
              error
            );

            if (
              error.message &&
              error.message
                .toLowerCase()
                .includes('bucket not found')
            ) {

              setUploadError(
                'The "medical-vault" bucket does not exist yet. Run the Supabase SQL setup provided above.'
              );

            } else {

              setUploadError(
                'Could not load your vault: ' +
                error.message
              );
            }

            setVaultFiles([]);
            return;
          }


          const files = (data || [])
            .filter(file => file.name)
            .map(file => ({
              ...file,

              path:
                `${userId}/${file.name}`
            }));


          setVaultFiles(files);

        } catch (error) {

          console.error(
            'Vault load error:',
            error
          );

          setUploadError(
            'Could not load your vault files.'
          );

        } finally {

          setVaultLoading(false);
        }
      }


      // =========================================================================
      // 11. UPLOAD FILE
      // =========================================================================

      async function handleVaultUpload(file) {

        if (!user) {

          setUploadError(
            'You must be signed in to upload files.'
          );

          return;
        }


        if (!file) {
          return;
        }


        // Only allow medical document formats for now
        const allowedTypes = [
          'application/pdf',
          'image/png',
          'image/jpeg'
        ];


        if (
          !allowedTypes.includes(
            file.type
          )
        ) {

          setUploadError(
            'Only PDF, PNG, and JPG files are allowed.'
          );

          setUploadMessage('');

          if (fileInputRef.current) {
            fileInputRef.current.value = '';
          }

          return;
        }


        // 25 MB maximum
        const maxSize =
          25 * 1024 * 1024;


        if (
          file.size > maxSize
        ) {

          setUploadError(
            'File is too large. Maximum size is 25MB.'
          );

          setUploadMessage('');

          if (fileInputRef.current) {
            fileInputRef.current.value = '';
          }

          return;
        }


        setUploading(true);
        setUploadMessage('');
        setUploadError('');


        try {

          // Remove unsafe characters from the original filename
          const safeName =
            file.name.replace(
              /[^a-zA-Z0-9._-]/g,
              '_'
            );


          // Give every uploaded file a unique filename
          const uniqueId =
            crypto.randomUUID
              ? crypto.randomUUID()
              : Date.now().toString(36);


          // IMPORTANT:
          // The first folder is the Supabase user ID.
          // This is what the Storage RLS policies use.
          const filePath =
            `${user.id}/${uniqueId}-${safeName}`;


          const {
            data,
            error
          } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .upload(
              filePath,
              file,
              {
                cacheControl: '3600',
                upsert: false,
                contentType: file.type
              }
            );


          if (error) {

            console.error(
              'Vault upload error:',
              error
            );


            if (
              error.message &&
              error.message
                .toLowerCase()
                .includes('bucket not found')
            ) {

              setUploadError(
                'Upload failed because the "medical-vault" bucket does not exist. Run the Supabase SQL setup above.'
              );

            } else {

              setUploadError(
                'Upload failed: ' +
                error.message
              );
            }

            return;
          }


          console.log(
            'Uploaded vault file:',
            data
          );


          setUploadMessage(
            `Uploaded successfully: ${file.name}`
          );


          // Refresh the vault immediately
          await loadVaultFiles(
            user.id
          );


        } catch (error) {

          console.error(
            'Vault upload error:',
            error
          );

          setUploadError(
            'Something went wrong during the upload.'
          );

        } finally {

          setUploading(false);

          if (fileInputRef.current) {
            fileInputRef.current.value = '';
          }
        }
      }


      // =========================================================================
      // 12. DOWNLOAD / OPEN A FILE
      // =========================================================================

      async function handleVaultDownload(file) {

        if (!user) return;

        setUploadError('');

        try {

          const {
            data,
            error
          } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .createSignedUrl(
              file.path,
              60 * 10
            );


          if (error) {

            console.error(
              'Signed URL error:',
              error
            );

            setUploadError(
              'Could not open the file: ' +
              error.message
            );

            return;
          }


          if (
            data?.signedUrl
          ) {

            window.open(
              data.signedUrl,
              '_blank',
              'noopener,noreferrer'
            );
          }

        } catch (error) {

          console.error(
            'Download error:',
            error
          );

          setUploadError(
            'Could not open this file.'
          );
        }
      }


      // =========================================================================
      // 13. DELETE A FILE
      // =========================================================================

      async function handleVaultDelete(file) {

        if (!user) return;


        const confirmed =
          window.confirm(
            `Delete "${file.name}" permanently?`
          );


        if (!confirmed) {
          return;
        }


        setDeletingFile(
          file.path
        );

        setUploadError('');


        try {

          const {
            error
          } = await supabase
            .storage
            .from(STORAGE_BUCKET)
            .remove([
              file.path
            ]);


          if (error) {

            console.error(
              'Delete error:',
              error
            );

            setUploadError(
              'Could not delete the file: ' +
              error.message
            );

            return;
          }


          setVaultFiles(
            previous =>
              previous.filter(
                item =>
                  item.path !==
                  file.path
              )
          );


          setUploadMessage(
            `Deleted: ${file.name}`
          );

        } catch (error) {

          console.error(
            'Delete error:',
            error
          );

          setUploadError(
            'Something went wrong while deleting the file.'
          );

        } finally {

          setDeletingFile(null);
        }
      }


      // =========================================================================
      // 14. AUTH MODAL FUNCTIONS
      // =========================================================================

      function closeAuthModal() {

        setShowAuthModal(false);

        setAuthError('');

        setAuthEmail('');

        setAuthPassword('');

        setAuthConfirmPassword('');

        setAuthName('');
      }


      function toggleAuthMode() {

        setIsSignUp(
          !isSignUp
        );

        setAuthError('');

        setAuthPassword('');

        setAuthConfirmPassword('');
      }


      // =========================================================================
      // 15. SUBMIT AUTH
      // =========================================================================

      async function submitAuth(e) {

        e.preventDefault();

        setAuthError('');


        if (isSignUp) {

          if (
            authPassword !==
            authConfirmPassword
          ) {

            setAuthError(
              'Passwords do not match. Please re-enter them.'
            );

            return;
          }


          if (
            authPassword.length < 6
          ) {

            setAuthError(
              'Password must be at least 6 characters.'
            );

            return;
          }


          const success =
            await handleSignUp(
              authEmail,
              authPassword,
              authName
            );


          if (success) {
            closeAuthModal();
          }

        } else {

          const loggedInUser =
            await handleLogin(
              authEmail,
              authPassword
            );


          if (loggedInUser) {

            setShowAuthModal(false);

            setAuthEmail('');

            setAuthPassword('');
          }
        }
      }


      // =========================================================================
      // 16. SAVE PROFILE
      // =========================================================================

      async function handleSaveProfile(e) {

        e.preventDefault();

        if (!user) return;


        setSaving(true);


        const formattedAllergies =
          allergies
            ? allergies
                .split(',')
                .map(
                  item =>
                    item.trim()
                )
            : [];


        const formattedMedications =
          medications
            ? medications
                .split(',')
                .map(
                  item =>
                    item.trim()
                )
            : [];


        const profilePayload = {

          email:
            user.email,

          full_name:
            fullName,

          blood_type:
            bloodType,

          age:
            age
              ? parseInt(age)
              : null,

          height:
            height,

          weight:
            weight,

          primary_doctor:
            primaryDoctor,

          allergies:
            formattedAllergies,

          medications:
            formattedMedications,

          emergency_contact:
            emergencyContact
        };


        const success =
          await saveUserProfile(
            user.id,
            profilePayload
          );


        if (success) {

          await loadProfile(
            user.id
          );
        }


        setSaving(false);
      }


      // =========================================================================
      // 17. HELPER FUNCTIONS FOR THE VAULT UI
      // =========================================================================

      function formatFileSize(bytes) {

        if (!bytes) {
          return 'Unknown size';
        }

        if (
          bytes < 1024
        ) {
          return `${bytes} B`;
        }

        if (
          bytes < 1024 * 1024
        ) {
          return `${(bytes / 1024).toFixed(1)} KB`;
        }

        return `${(
          bytes /
          (1024 * 1024)
        ).toFixed(1)} MB`;
      }


      function formatFileDate(dateString) {

        if (!dateString) {
          return '';
        }

        return new Date(
          dateString
        ).toLocaleString(
          undefined,
          {
            dateStyle: 'medium',
            timeStyle: 'short'
          }
        );
      }


      function getFileIcon(fileName) {

        const extension =
          fileName
            .split('.')
            .pop()
            ?.toLowerCase();


        if (
          extension === 'pdf'
        ) {
          return '📄';
        }

        if (
          extension === 'png' ||
          extension === 'jpg' ||
          extension === 'jpeg'
        ) {
          return '🖼️';
        }

        return '📁';
      }


      // =========================================================================
      // 18. LOADING SCREEN
      // =========================================================================

      if (loading) {

        return (

          <div className="flex h-screen items-center justify-center bg-slate-900 text-slate-100">

            <div className="text-center">

              <div className="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>

              <p className="text-sm font-medium tracking-wide text-slate-300">
                Loading Diroa Health Portal...
              </p>

            </div>

          </div>
        );
      }


      // =========================================================================
      // 19. APPLICATION
      // =========================================================================

      return (

        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">


          {/* ================================================================
              TOP HEADER
          ================================================================ */}

          <header className="border-b border-slate-800 bg-slate-950/90 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-40">

            <div className="flex items-center gap-3">

              <img
                src={DIROA_LOGO}
                alt="Diroa Health"
                draggable="false"
                className="h-7 sm:h-8 w-auto select-none rounded"
              />

              <div className="hidden sm:block border-l border-slate-700 pl-3 ml-1">

                <p className="text-[10px] text-cyan-400 uppercase tracking-wider font-semibold leading-tight">
                  Records &
                  <br />
                  Emergency Portal
                </p>

              </div>

            </div>


            {/* ============================================================
                DESKTOP NAVIGATION
            ============================================================ */}

            {user && (

              <nav className="hidden md:flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800">

                <button
                  onClick={() =>
                    setActiveTab('dashboard')
                  }
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${
                    activeTab === 'dashboard'
                      ? 'bg-cyan-600 text-white shadow'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Dashboard
                </button>


                <button
                  onClick={() =>
                    setActiveTab('profile')
                  }
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${
                    activeTab === 'profile'
                      ? 'bg-cyan-600 text-white shadow'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Edit Profile
                </button>


                <button
                  onClick={() =>
                    setActiveTab('vault')
                  }
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${
                    activeTab === 'vault'
                      ? 'bg-cyan-600 text-white shadow'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  Medical Vault
                </button>

              </nav>
            )}


            {/* ============================================================
                ACCOUNT CONTROLS
            ============================================================ */}

            <div>

              {user ? (

                <div className="flex items-center gap-4">

                  <span className="text-xs font-medium text-slate-400 hidden sm:inline">
                    {user.email}
                  </span>


                  <button
                    onClick={handleLogout}
                    className="px-3.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition"
                  >
                    Sign Out
                  </button>

                </div>

              ) : (

                <button
                  onClick={() =>
                    setShowAuthModal(true)
                  }
                  className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition shadow-lg shadow-cyan-900/30"
                >
                  Sign In / Register
                </button>

              )}

            </div>

          </header>


          {/* ================================================================
              MOBILE NAVIGATION
          ================================================================ */}

          {user && (

            <div className="flex md:hidden bg-slate-950 border-b border-slate-800 p-2 justify-around">

              <button
                onClick={() =>
                  setActiveTab('dashboard')
                }
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${
                  activeTab === 'dashboard'
                    ? 'bg-cyan-600 text-white'
                    : 'text-slate-400'
                }`}
              >
                Dashboard
              </button>


              <button
                onClick={() =>
                  setActiveTab('profile')
                }
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${
                  activeTab === 'profile'
                    ? 'bg-cyan-600 text-white'
                    : 'text-slate-400'
                }`}
              >
                Edit Profile
              </button>


              <button
                onClick={() =>
                  setActiveTab('vault')
                }
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${
                  activeTab === 'vault'
                    ? 'bg-cyan-600 text-white'
                    : 'text-slate-400'
                }`}
              >
                Medical Vault
              </button>

            </div>
          )}


          {/* ================================================================
              MAIN
          ================================================================ */}

          <main className="p-6 max-w-5xl mx-auto flex-1 w-full">

            {user ? (

              <div className="space-y-6">


                {/* ==========================================================
                    DASHBOARD
                ========================================================== */}

                {activeTab === 'dashboard' && (

                  <div className="space-y-6">


                    <div className="bg-gradient-to-r from-slate-800 via-slate-800/90 to-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl relative overflow-hidden">

                      <div className="absolute top-0 right-0 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

                      <div className="relative z-10">

                        <span className="inline-block px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-cyan-400 bg-cyan-950/80 border border-cyan-800/60 rounded-full mb-3">
                          Verified Health Portal
                        </span>

                        <h2 className="text-2xl font-extrabold text-white mb-1">
                          Welcome, {fullName || user.email}
                        </h2>

                        <p className="text-xs text-slate-400 max-w-xl leading-relaxed">
                          Your profile data is saved to your personal Supabase database and your medical documents are stored in your private account vault.
                        </p>

                      </div>

                    </div>


                    {/* QUICK PROFILE SUMMARY */}

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">


                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">

                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">
                          Blood Type
                        </p>

                        <p className="text-xl font-bold text-cyan-400">
                          {bloodType || 'Not Set'}
                        </p>

                      </div>


                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">

                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">
                          Primary Doctor
                        </p>

                        <p className="text-sm font-bold text-slate-200 truncate">
                          {primaryDoctor || 'Not Set'}
                        </p>

                      </div>


                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">

                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">
                          Height / Weight
                        </p>

                        <p className="text-sm font-bold text-slate-200">
                          {height || '--'} / {weight || '--'}
                        </p>

                      </div>


                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">

                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">
                          Emergency Contact
                        </p>

                        <p className="text-sm font-bold text-slate-200 truncate">
                          {emergencyContact || 'Not Set'}
                        </p>

                      </div>

                    </div>


                    {/* ALLERGIES + MEDICATIONS */}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">


                      <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-5">

                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                          Known Allergies
                        </h3>

                        <p className="text-xs text-slate-400">
                          {allergies || 'No allergies recorded.'}
                        </p>

                      </div>


                      <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-5">

                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                          Current Medications
                        </h3>

                        <p className="text-xs text-slate-400">
                          {medications || 'No active medications recorded.'}
                        </p>

                      </div>

                    </div>


                    {/* ACTION HUB */}

                    <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-6 flex items-center justify-between flex-wrap gap-4">

                      <div>

                        <h3 className="text-sm font-bold text-slate-200 mb-1">
                          Manage Health Records
                        </h3>

                        <p className="text-xs text-slate-400">
                          Update medical metrics, vitals, and emergency contact details.
                        </p>

                      </div>


                      <button
                        onClick={() =>
                          setActiveTab('profile')
                        }
                        className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition"
                      >
                        Edit Health Profile
                      </button>

                    </div>

                  </div>
                )}


                {/* ==========================================================
                    EDIT PROFILE
                ========================================================== */}

                {activeTab === 'profile' && (

                  <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">

                    <h2 className="text-xl font-bold text-white mb-1">
                      Personal Health Profile Template
                    </h2>

                    <p className="text-xs text-slate-400 mb-6">
                      Fill in your health records below. Submitting saves directly to your database.
                    </p>


                    <form
                      onSubmit={handleSaveProfile}
                      className="space-y-5"
                    >


                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Full Legal Name
                          </label>

                          <input
                            type="text"
                            value={fullName}
                            onChange={(e) =>
                              setFullName(
                                e.target.value
                              )
                            }
                            placeholder="e.g. Alex Morgan"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Blood Type
                          </label>

                          <select
                            value={bloodType}
                            onChange={(e) =>
                              setBloodType(
                                e.target.value
                              )
                            }
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          >

                            <option value="">
                              Select Blood Type...
                            </option>

                            <option value="A+">
                              A+
                            </option>

                            <option value="A-">
                              A-
                            </option>

                            <option value="B+">
                              B+
                            </option>

                            <option value="B-">
                              B-
                            </option>

                            <option value="AB+">
                              AB+
                            </option>

                            <option value="AB-">
                              AB-
                            </option>

                            <option value="O+">
                              O+
                            </option>

                            <option value="O-">
                              O-
                            </option>

                            <option value="Unsure">
                              Unsure
                            </option>

                          </select>

                        </div>

                      </div>


                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Age
                          </label>

                          <input
                            type="number"
                            value={age}
                            onChange={(e) =>
                              setAge(
                                e.target.value
                              )
                            }
                            placeholder="e.g. 32"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Height
                          </label>

                          <input
                            type="text"
                            value={height}
                            onChange={(e) =>
                              setHeight(
                                e.target.value
                              )
                            }
                            placeholder={`e.g. 5'11"`}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Weight
                          </label>

                          <input
                            type="text"
                            value={weight}
                            onChange={(e) =>
                              setWeight(
                                e.target.value
                              )
                            }
                            placeholder="e.g. 175 lbs"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>

                      </div>


                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Primary Physician / Doctor
                          </label>

                          <input
                            type="text"
                            value={primaryDoctor}
                            onChange={(e) =>
                              setPrimaryDoctor(
                                e.target.value
                              )
                            }
                            placeholder="e.g. Dr. Robert Chen"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>


                        <div>

                          <label className="block text-xs font-medium text-slate-400 mb-1">
                            Emergency Contact Info
                          </label>

                          <input
                            type="text"
                            value={emergencyContact}
                            onChange={(e) =>
                              setEmergencyContact(
                                e.target.value
                              )
                            }
                            placeholder="e.g. Jane Morgan (Spouse) - (555) 019-2831"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />

                        </div>

                      </div>


                      <div>

                        <label className="block text-xs font-medium text-slate-400 mb-1">
                          Known Allergies (comma-separated)
                        </label>

                        <input
                          type="text"
                          value={allergies}
                          onChange={(e) =>
                            setAllergies(
                              e.target.value
                            )
                          }
                          placeholder="e.g. Penicillin, Peanuts, Latex"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        />

                      </div>


                      <div>

                        <label className="block text-xs font-medium text-slate-400 mb-1">
                          Active Medications (comma-separated)
                        </label>

                        <input
                          type="text"
                          value={medications}
                          onChange={(e) =>
                            setMedications(
                              e.target.value
                            )
                          }
                          placeholder="e.g. Lisinopril 10mg, Vitamin D3"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        />

                      </div>


                      <div className="pt-2">

                        <button
                          type="submit"
                          disabled={saving}
                          className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-lg shadow-cyan-900/30 disabled:opacity-50"
                        >

                          {
                            saving
                              ? 'Saving Records...'
                              : 'Save Profile to Database'
                          }

                        </button>

                      </div>

                    </form>

                  </div>
                )}


                {/* ==========================================================
                    MEDICAL VAULT
                ========================================================== */}

                {activeTab === 'vault' && (

                  <div className="space-y-6">


                    <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">

                      <h2 className="text-xl font-bold text-white mb-1">
                        Medical Document Vault
                      </h2>

                      <p className="text-xs text-slate-400 mb-6">
                        Upload lab results, prescription receipts, imaging reports, and other medical documents. Files are stored in your private account folder.
                      </p>


                      {/* ====================================================
                          UPLOAD AREA
                      ==================================================== */}

                      <div
                        onClick={() =>
                          !uploading &&
                          fileInputRef.current?.click()
                        }

                        onDragOver={(e) => {

                          e.preventDefault();

                          if (!uploading) {

                            e.currentTarget.classList.add(
                              'border-cyan-500'
                            );
                          }
                        }}

                        onDragLeave={(e) => {

                          e.currentTarget.classList.remove(
                            'border-cyan-500'
                          );
                        }}

                        onDrop={(e) => {

                          e.preventDefault();

                          e.currentTarget.classList.remove(
                            'border-cyan-500'
                          );

                          if (!uploading) {

                            const file =
                              e.dataTransfer.files?.[0];

                            handleVaultUpload(
                              file
                            );
                          }
                        }}

                        className={`border-2 border-dashed rounded-xl p-8 text-center bg-slate-900/40 transition ${
                          uploading
                            ? 'border-slate-700 opacity-70 cursor-wait'
                            : 'border-slate-700 hover:border-cyan-500/50 cursor-pointer'
                        }`}
                      >


                        <input
                          ref={fileInputRef}
                          type="file"
                          accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"
                          className="hidden"

                          onChange={(e) => {

                            const file =
                              e.target.files?.[0];

                            handleVaultUpload(
                              file
                            );
                          }}

                          disabled={uploading}
                        />


                        <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-3 text-cyan-400 text-lg">

                          {
                            uploading
                              ? '⏳'
                              : '📁'
                          }

                        </div>


                        <p className="text-xs font-semibold text-slate-200">

                          {
                            uploading
                              ? 'Uploading...'
                              : 'Click to upload or drag and drop'
                          }

                        </p>


                        <p className="text-[10px] text-slate-500 mt-1">
                          Supports PDF, PNG, JPG up to 25MB
                        </p>


                        {uploadMessage && (

                          <p className="text-[10px] text-cyan-400 mt-3">
                            {uploadMessage}
                          </p>

                        )}


                        {uploadError && (

                          <p className="text-[10px] text-red-400 mt-3">
                            {uploadError}
                          </p>

                        )}

                      </div>

                    </div>


                    {/* ====================================================
                        YOUR FILES
                    ==================================================== */}

                    <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">

                      <div className="flex items-center justify-between mb-5">

                        <div>

                          <h3 className="text-sm font-bold text-white">
                            Your Medical Files
                          </h3>

                          <p className="text-[10px] text-slate-500 mt-1">
                            Only files belonging to your account are shown here.
                          </p>

                        </div>


                        <button
                          onClick={() =>
                            user &&
                            loadVaultFiles(
                              user.id
                            )
                          }
                          disabled={vaultLoading}
                          className="px-3 py-1.5 text-[10px] font-semibold bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-lg text-slate-300 disabled:opacity-50"
                        >
                          {vaultLoading
                            ? 'Refreshing...'
                            : 'Refresh'}
                        </button>

                      </div>


                      {vaultLoading ? (

                        <div className="text-center py-10">

                          <div className="w-8 h-8 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>

                          <p className="text-xs text-slate-500">
                            Loading your files...
                          </p>

                        </div>

                      ) : vaultFiles.length === 0 ? (

                        <div className="text-center py-10 border border-slate-800 rounded-xl bg-slate-900/30">

                          <div className="text-3xl mb-3">
                            📂
                          </div>

                          <p className="text-xs font-semibold text-slate-300">
                            No files yet
                          </p>

                          <p className="text-[10px] text-slate-500 mt-1">
                            Uploaded documents will appear here.
                          </p>

                        </div>

                      ) : (

                        <div className="space-y-2">


                          {vaultFiles.map(
                            (file) => (

                              <div
                                key={file.path}
                                className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center gap-4"
                              >


                                {/* FILE ICON */}

                                <div className="w-10 h-10 rounded-lg bg-slate-800 flex items-center justify-center text-lg shrink-0">
                                  {getFileIcon(
                                    file.name
                                  )}
                                </div>


                                {/* FILE INFO */}

                                <div className="min-w-0 flex-1">

                                  <p
                                    className="text-xs font-semibold text-slate-200 truncate"
                                    title={file.name}
                                  >
                                    {file.name}
                                  </p>

                                  <p className="text-[10px] text-slate-500 mt-1">

                                    {formatFileSize(
                                      file.metadata?.size
                                    )}

                                    {' • '}

                                    {formatFileDate(
                                      file.created_at
                                    )}

                                  </p>

                                </div>


                                {/* FILE ACTIONS */}

                                <div className="flex items-center gap-2 shrink-0">


                                  <button
                                    onClick={() =>
                                      handleVaultDownload(
                                        file
                                      )
                                    }
                                    className="px-3 py-1.5 text-[10px] font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition"
                                  >
                                    Open
                                  </button>


                                  <button
                                    onClick={() =>
                                      handleVaultDelete(
                                        file
                                      )
                                    }
                                    disabled={
                                      deletingFile ===
                                      file.path
                                    }
                                    className="px-3 py-1.5 text-[10px] font-semibold bg-slate-800 hover:bg-red-900/50 text-red-400 border border-slate-700 hover:border-red-800 rounded-lg transition disabled:opacity-50"
                                  >
                                    {
                                      deletingFile ===
                                      file.path
                                        ? 'Deleting...'
                                        : 'Delete'
                                    }
                                  </button>

                                </div>

                              </div>

                            )
                          )}

                        </div>

                      )}

                    </div>

                  </div>
                )}

              </div>

            ) : (

              /* ==============================================================
                 SIGNED OUT
              ============================================================== */

              <div className="text-center py-20">

                <img
                  src={DIROA_LOGO}
                  alt="Diroa Health"
                  draggable="false"
                  className="h-12 sm:h-14 w-auto select-none mx-auto mb-6 rounded"
                />

                <h2 className="text-3xl font-extrabold text-white mb-3">
                  Diroa Health Portal
                </h2>

                <p className="text-slate-400 max-w-md mx-auto mb-8 text-xs leading-relaxed">
                  Sign in or register an account to manage your digital health profile, view medical records, and save emergency information.
                </p>

                <button
                  onClick={() =>
                    setShowAuthModal(true)
                  }
                  className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-xl shadow-xl shadow-cyan-900/40 transition hover:scale-105 transform"
                >
                  Access Your Portal
                </button>

              </div>

            )}

          </main>


          {/* ================================================================
              AUTH MODAL
          ================================================================ */}

          {showAuthModal && (

            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">

              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">


                <button
                  onClick={closeAuthModal}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>


                <h3 className="text-lg font-bold text-white mb-1">

                  {
                    isSignUp
                      ? 'Create Health Account'
                      : 'Sign In to Diroa'
                  }

                </h3>


                <p className="text-xs text-slate-400 mb-6">

                  {
                    isSignUp
                      ? 'Enter your details to create a new profile.'
                      : 'Access your connected health record.'
                  }

                </p>


                <form
                  onSubmit={submitAuth}
                  className="space-y-4"
                >


                  {isSignUp && (

                    <div>

                      <label className="block text-xs font-medium text-slate-400 mb-1">
                        Full Name
                      </label>

                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) =>
                          setAuthName(
                            e.target.value
                          )
                        }
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        placeholder="e.g. Alex Morgan"
                      />

                    </div>

                  )}


                  <div>

                    <label className="block text-xs font-medium text-slate-400 mb-1">
                      Email Address
                    </label>

                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) =>
                        setAuthEmail(
                          e.target.value
                        )
                      }
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="name@example.com"
                    />

                  </div>


                  <div>

                    <label className="block text-xs font-medium text-slate-400 mb-1">
                      Password
                    </label>

                    <input
                      type="password"
                      required
                      value={authPassword}
                      onChange={(e) =>
                        setAuthPassword(
                          e.target.value
                        )
                      }
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="••••••••"
                    />

                  </div>


                  {isSignUp && (

                    <div>

                      <label className="block text-xs font-medium text-slate-400 mb-1">
                        Confirm Password
                      </label>

                      <input
                        type="password"
                        required
                        value={authConfirmPassword}
                        onChange={(e) =>
                          setAuthConfirmPassword(
                            e.target.value
                          )
                        }
                        className={`w-full bg-slate-900 border rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none ${
                          authConfirmPassword &&
                          authConfirmPassword !==
                            authPassword
                            ? 'border-red-500 focus:border-red-500'
                            : 'border-slate-700 focus:border-cyan-500'
                        }`}
                        placeholder="••••••••"
                      />

                    </div>

                  )}


                  {authError && (

                    <p className="text-xs text-red-400 -mt-1">
                      {authError}
                    </p>

                  )}


                  <button
                    type="submit"
                    className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-md shadow-cyan-900/30"
                  >

                    {
                      isSignUp
                        ? 'Register Account'
                        : 'Sign In'
                    }

                  </button>

                </form>


                <div className="mt-4 text-center">

                  <button
                    type="button"
                    onClick={toggleAuthMode}
                    className="text-xs text-cyan-400 hover:underline"
                  >

                    {
                      isSignUp
                        ? 'Already have an account? Sign In'
                        : "Don't have an account? Register"
                    }

                  </button>

                </div>

              </div>

            </div>

          )}

        </div>
      );
    }


    // =========================================================================
    // 20. MOUNT REACT APP
    // =========================================================================

    const root =
      ReactDOM.createRoot(
        document.getElementById('root')
      );

    root.render(
      <App />
    );

  </script>

</body>
</html>
