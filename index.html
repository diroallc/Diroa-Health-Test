<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Login</title>
  <!-- Load Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --error: #ef4444;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 0.75rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
    }

    .hidden {
      display: none !important;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 1.5rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      box-sizing: border-box;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.375rem;
      border: none;
      background-color: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 0.5rem;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.secondary {
      background-color: var(--border);
    }

    button.secondary:hover {
      background-color: #475569;
    }

    #message {
      margin-bottom: 1rem;
      font-size: 0.875rem;
      word-break: break-word;
    }

    .error-msg { color: var(--error); }
    .success-msg { color: var(--success); }
  </style>
</head>
<body>

  <div class="card">
    <!-- 1. Initial Loading State -->
    <div id="loading-view">
      <p>Loading application...</p>
    </div>

    <!-- 2. Authentication View (Login / Sign Up) -->
    <div id="auth-view" class="hidden">
      <h2>Sign In</h2>
      <div id="message" class="hidden"></div>
      <form id="auth-form">
        <input type="email" id="email" placeholder="Email address" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" id="login-btn">Log In</button>
        <button type="button" id="signup-btn" class="secondary">Create Account</button>
      </form>
    </div>

    <!-- 3. Protected Dashboard View (Renders post-login) -->
    <div id="dashboard-view" class="hidden">
      <h2>Welcome Back</h2>
      <p>Logged in as: <strong id="user-email"></strong></p>
      <button id="logout-btn" class="secondary">Log Out</button>
    </div>
  </div>

  <script>
    // Configuration Settings
    const SUPABASE_URL = 'https://YOUR_PROJECT_ID.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_ANON_KEY';

    // Initialize Supabase Client
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM Elements
    const loadingView = document.getElementById('loading-view');
    const authView = document.getElementById('auth-view');
    const dashboardView = document.getElementById('dashboard-view');
    const messageEl = document.getElementById('message');
    const userEmailEl = document.getElementById('user-email');

    function showMessage(text, isError = true) {
      messageEl.textContent = text;
      messageEl.className = isError ? 'error-msg' : 'success-msg';
      messageEl.classList.remove('hidden');
    }

    function clearMessage() {
      messageEl.textContent = '';
      messageEl.classList.add('hidden');
    }

    // Controls display states without crashing on empty values
    function renderUI(session) {
      loadingView.classList.add('hidden');

      if (session && session.user) {
        userEmailEl.textContent = session.user.email ?? 'Authenticated User';
        authView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
      } else {
        dashboardView.classList.add('hidden');
        authView.classList.remove('hidden');
      }
    }

    // App Initialization
    async function initApp() {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) throw error;
        renderUI(session);
      } catch (err) {
        console.error('Session initialization error:', err);
        renderUI(null);
        showMessage(err.message || 'Failed to establish session.');
      }
    }

    // Auth State Listener for real-time sign-in/sign-out events
    supabase.auth.onAuthStateChange((event, session) => {
      renderUI(session);
    });

    // Handle Login
    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        showMessage(error.message, true);
      }
    });

    // Handle Sign Up
    document.getElementById('signup-btn').addEventListener('click', async () => {
      clearMessage();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please enter both email and password.', true);
        return;
      }

      const { data, error } = await supabase.auth.signUp({ email, password });

      if (error) {
        showMessage(error.message, true);
      } else if (data.session) {
        showMessage('Account created and signed in!', false);
      } else {
        showMessage('Account created! You can now log in.', false);
      }
    });

    // Handle Log Out
    document.getElementById('logout-btn').addEventListener('click', async () => {
      clearMessage();
      const { error } = await supabase.auth.signOut();
      if (error) {
        showMessage(error.message, true);
      }
    });

    // Execute application load
    initApp();
  </script>
</body>
</html>
