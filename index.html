
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Prevent Browser & CDN Caching of Old Versions -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Diroa Health Profiles</title>

  <!-- External CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================================
    // 1. SUPABASE CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = 'https://ikzrbztopdmxhneloyim.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrenJienRvcGRteGhuZWxveWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzM0MDUsImV4cCI6MjEwNTk0OTQwNX0.yOtplAIElZrbdx-M-Cs12vE5Av6p8uBxiYY3IkHMCwA';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================================
    // 2. AUTHENTICATION & DATABASE HELPERS
    // =========================================================================
    async function handleSignUp(email, password, fullName) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: fullName } }
      });
      if (error) {
        alert('Registration Error: ' + error.message);
        return false;
      }
      alert('Account registered! If confirmation is enabled, check your inbox.');
      return true;
    }

    async function handleLogin(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });
      if (error) {
        alert('Login Error: ' + error.message);
        return null;
      }
      return data.user;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
    }

    async function fetchUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .maybeSingle();

      if (error) {
        console.error('Error fetching profile:', error.message);
      }
      return data;
    }

    async function saveUserProfile(userId, profileData) {
      // Uses UPSERT to insert or update seamlessly
      const payload = {
        id: userId,
        ...profileData,
        updated_at: new Date().toISOString()
      };

      const { data, error } = await supabase
        .from('profiles')
        .upsert(payload, { onConflict: 'id' });

      if (error) {
        alert('Error saving profile: ' + error.message);
        return false;
      }
      
      alert('Health profile saved successfully!');
      return true;
    }

    // =========================================================================
    // 3. MAIN REACT APPLICATION
    // =========================================================================
    function App() {
      const [user, setUser] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [activeTab, setActiveTab] = React.useState('dashboard');
      
      // Auth Modal Controls
      const [showAuthModal, setShowAuthModal] = React.useState(false);
      const [isSignUp, setIsSignUp] = React.useState(false);
      const [authEmail, setAuthEmail] = React.useState('');
      const [authPassword, setAuthPassword] = React.useState('');
      const [authName, setAuthName] = React.useState('');

      // User Profile Form State (Blank defaults for real user input)
      const [fullName, setFullName] = React.useState('');
      const [bloodType, setBloodType] = React.useState('');
      const [age, setAge] = React.useState('');
      const [height, setHeight] = React.useState('');
      const [weight, setWeight] = React.useState('');
      const [primaryDoctor, setPrimaryDoctor] = React.useState('');
      const [allergies, setAllergies] = React.useState('');
      const [medications, setMedications] = React.useState('');
      const [emergencyContact, setEmergencyContact] = React.useState('');
      const [saving, setSaving] = React.useState(false);

      // Check user session on initial load and subscribe to auth updates
      React.useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) {
            loadProfile(currentUser.id);
          }
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) {
            loadProfile(currentUser.id);
          } else {
            setUserProfile(null);
            clearForm();
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      function clearForm() {
        setFullName('');
        setBloodType('');
        setAge('');
        setHeight('');
        setWeight('');
        setPrimaryDoctor('');
        setAllergies('');
        setMedications('');
        setEmergencyContact('');
      }

      async function loadProfile(userId) {
        const data = await fetchUserProfile(userId);
        if (data) {
          setUserProfile(data);
          setFullName(data.full_name || '');
          setBloodType(data.blood_type || '');
          setAge(data.age || '');
          setHeight(data.height || '');
          setWeight(data.weight || '');
          setPrimaryDoctor(data.primary_doctor || '');
          setAllergies(Array.isArray(data.allergies) ? data.allergies.join(', ') : (data.allergies || ''));
          setMedications(Array.isArray(data.medications) ? data.medications.join(', ') : (data.medications || ''));
          setEmergencyContact(data.emergency_contact || '');
        }
      }

      async function submitAuth(e) {
        e.preventDefault();
        if (isSignUp) {
          const success = await handleSignUp(authEmail, authPassword, authName);
          if (success) {
            setShowAuthModal(false);
            setAuthEmail('');
            setAuthPassword('');
            setAuthName('');
          }
        } else {
          const loggedInUser = await handleLogin(authEmail, authPassword);
          if (loggedInUser) {
            setShowAuthModal(false);
            setAuthEmail('');
            setAuthPassword('');
          }
        }
      }

      async function handleSaveProfile(e) {
        e.preventDefault();
        if (!user) return;

        setSaving(true);
        const formattedAllergies = allergies ? allergies.split(',').map(item => item.trim()) : [];
        const formattedMedications = medications ? medications.split(',').map(item => item.trim()) : [];

        const profilePayload = {
          email: user.email,
          full_name: fullName,
          blood_type: bloodType,
          age: age ? parseInt(age) : null,
          height: height,
          weight: weight,
          primary_doctor: primaryDoctor,
          allergies: formattedAllergies,
          medications: formattedMedications,
          emergency_contact: emergencyContact
        };

        const success = await saveUserProfile(user.id, profilePayload);
        if (success) {
          await loadProfile(user.id);
        }
        setSaving(false);
      }

      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-900 text-slate-100">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-sm font-medium tracking-wide text-slate-300">Loading Diroa Health Portal...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Top Header */}
          <header className="border-b border-slate-800 bg-slate-950/90 backdrop-blur px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-400 flex items-center justify-center font-bold text-white shadow-lg shadow-cyan-900/30">
                D
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-wide text-white leading-none">Diroa Health</h1>
                <p className="text-[10px] text-cyan-400 uppercase tracking-wider font-semibold mt-0.5">Records & Emergency Portal</p>
              </div>
            </div>

            {/* Navigation Bar */}
            {user && (
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/90 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'dashboard' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('profile')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'profile' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Edit Profile
                </button>
                <button
                  onClick={() => setActiveTab('vault')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'vault' ? 'bg-cyan-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Medical Vault
                </button>
              </nav>
            )}

            <div>
              {user ? (
                <div className="flex items-center gap-4">
                  <span className="text-xs font-medium text-slate-400 hidden sm:inline">{user.email}</span>
                  <button
                    onClick={handleLogout}
                    className="px-3.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition"
                  >
                    Sign Out
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition shadow-lg shadow-cyan-900/30"
                >
                  Sign In / Register
                </button>
              )}
            </div>
          </header>

          {/* Mobile Navigation */}
          {user && (
            <div className="flex md:hidden bg-slate-950 border-b border-slate-800 p-2 justify-around">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${activeTab === 'dashboard' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}
              >
                Dashboard
              </button>
              <button
                onClick={() => setActiveTab('profile')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${activeTab === 'profile' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}
              >
                Edit Profile
              </button>
              <button
                onClick={() => setActiveTab('vault')}
                className={`px-3 py-1.5 text-xs font-semibold rounded-lg ${activeTab === 'vault' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}
              >
                Medical Vault
              </button>
            </div>
          )}

          {/* Main Content Area */}
          <main className="p-6 max-w-5xl mx-auto flex-1 w-full">
            {user ? (
              <div className="space-y-6">
                
                {/* TAB 1: DASHBOARD */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="bg-gradient-to-r from-slate-800 via-slate-800/90 to-slate-800/70 border border-slate-700/80 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-72 h-72 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
                      <div className="relative z-10">
                        <span className="inline-block px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-cyan-400 bg-cyan-950/80 border border-cyan-800/60 rounded-full mb-3">
                          Verified Health Portal
                        </span>
                        <h2 className="text-2xl font-extrabold text-white mb-1">
                          Welcome, {fullName || user.email}
                        </h2>
                        <p className="text-xs text-slate-400 max-w-xl leading-relaxed">
                          Your profile data is encrypted and saved directly in your personal Supabase database table.
                        </p>
                      </div>
                    </div>

                    {/* Quick Profile Summary */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">Blood Type</p>
                        <p className="text-xl font-bold text-cyan-400">{bloodType || 'Not Set'}</p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">Primary Doctor</p>
                        <p className="text-sm font-bold text-slate-200 truncate">{primaryDoctor || 'Not Set'}</p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">Height / Weight</p>
                        <p className="text-sm font-bold text-slate-200">
                          {height || '--'} / {weight || '--'}
                        </p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-[11px] font-semibold uppercase text-slate-400 mb-1">Emergency Contact</p>
                        <p className="text-sm font-bold text-slate-200 truncate">{emergencyContact || 'Not Set'}</p>
                      </div>
                    </div>

                    {/* Allergies & Medications Overview */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-5">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Known Allergies</h3>
                        <p className="text-xs text-slate-400">
                          {allergies || 'No allergies recorded.'}
                        </p>
                      </div>
                      <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-5">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Current Medications</h3>
                        <p className="text-xs text-slate-400">
                          {medications || 'No active medications recorded.'}
                        </p>
                      </div>
                    </div>

                    {/* Action Hub */}
                    <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-6 flex items-center justify-between flex-wrap gap-4">
                      <div>
                        <h3 className="text-sm font-bold text-slate-200 mb-1">Manage Health Records</h3>
                        <p className="text-xs text-slate-400">Update medical metrics, vitals, and emergency contact details.</p>
                      </div>
                      <button 
                        onClick={() => setActiveTab('profile')} 
                        className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition"
                      >
                        Edit Health Profile
                      </button>
                    </div>
                  </div>
                )}

                {/* TAB 2: EDIT PROFILE FORM */}
                {activeTab === 'profile' && (
                  <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 className="text-xl font-bold text-white mb-1">Personal Health Profile Template</h2>
                    <p className="text-xs text-slate-400 mb-6">Fill in your health records below. Submitting saves directly to your database.</p>

                    <form onSubmit={handleSaveProfile} className="space-y-5">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Full Legal Name</label>
                          <input
                            type="text"
                            value={fullName}
                            onChange={(e) => setFullName(e.target.value)}
                            placeholder="e.g. Alex Morgan"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Blood Type</label>
                          <select
                            value={bloodType}
                            onChange={(e) => setBloodType(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          >
                            <option value="">Select Blood Type...</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Age</label>
                          <input
                            type="number"
                            value={age}
                            onChange={(e) => setAge(e.target.value)}
                            placeholder="e.g. 32"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Height</label>
                          <input
                            type="text"
                            value={height}
                            onChange={(e) => setHeight(e.target.value)}
                            placeholder="e.g. 5'11&quot;"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Weight</label>
                          <input
                            type="text"
                            value={weight}
                            onChange={(e) => setWeight(e.target.value)}
                            placeholder="e.g. 175 lbs"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Primary Physician / Doctor</label>
                          <input
                            type="text"
                            value={primaryDoctor}
                            onChange={(e) => setPrimaryDoctor(e.target.value)}
                            placeholder="e.g. Dr. Robert Chen"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Emergency Contact Info</label>
                          <input
                            type="text"
                            value={emergencyContact}
                            onChange={(e) => setEmergencyContact(e.target.value)}
                            placeholder="e.g. Jane Morgan (Spouse) - (555) 019-2831"
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Known Allergies (comma-separated)</label>
                        <input
                          type="text"
                          value={allergies}
                          onChange={(e) => setAllergies(e.target.value)}
                          placeholder="e.g. Penicillin, Peanuts, Latex"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Active Medications (comma-separated)</label>
                        <input
                          type="text"
                          value={medications}
                          onChange={(e) => setMedications(e.target.value)}
                          placeholder="e.g. Lisinopril 10mg, Vitamin D3"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        />
                      </div>

                      <div className="pt-2">
                        <button
                          type="submit"
                          disabled={saving}
                          className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-lg shadow-cyan-900/30 disabled:opacity-50"
                        >
                          {saving ? 'Saving Records...' : 'Save Profile to Database'}
                        </button>
                      </div>
                    </form>
                  </div>
                )}

                {/* TAB 3: MEDICAL VAULT */}
                {activeTab === 'vault' && (
                  <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 className="text-xl font-bold text-white mb-1">Medical Document Vault</h2>
                    <p className="text-xs text-slate-400 mb-6">Upload lab results, prescription receipts, or imaging reports.</p>

                    <div className="border-2 border-dashed border-slate-700 hover:border-cyan-500/50 rounded-xl p-8 text-center bg-slate-900/40 transition cursor-pointer">
                      <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-3 text-cyan-400 text-lg">
                        📁
                      </div>
                      <p className="text-xs font-semibold text-slate-200">Drag and drop health records here</p>
                      <p className="text-[10px] text-slate-500 mt-1">Supports PDF, PNG, JPG up to 25MB</p>
                    </div>
                  </div>
                )}

              </div>
            ) : (
              /* SIGNED OUT HERO STATE */
              <div className="text-center py-20">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-400 flex items-center justify-center font-bold text-2xl text-white mx-auto mb-6 shadow-xl shadow-cyan-900/40">
                  D
                </div>
                <h2 className="text-3xl font-extrabold text-white mb-3">Diroa Health Portal</h2>
                <p className="text-slate-400 max-w-md mx-auto mb-8 text-xs leading-relaxed">
                  Sign in or register an account to manage your digital health profile, view encrypted medical records, and save emergency information.
                </p>
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-xl shadow-xl shadow-cyan-900/40 transition hover:scale-105 transform"
                >
                  Access Your Portal
                </button>
              </div>
            )}
          </main>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
                <button 
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <h3 className="text-lg font-bold text-white mb-1">
                  {isSignUp ? 'Create Health Account' : 'Sign In to Diroa'}
                </h3>
                <p className="text-xs text-slate-400 mb-6">
                  {isSignUp ? 'Enter your details to create a new profile.' : 'Access your connected health record.'}
                </p>
                
                <form onSubmit={submitAuth} className="space-y-4">
                  {isSignUp && (
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        placeholder="e.g. Alex Morgan"
                      />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="name@example.com"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="••••••••"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-md shadow-cyan-900/30"
                  >
                    {isSignUp ? 'Register Account' : 'Sign In'}
                  </button>
                </form>

                <div className="mt-4 text-center">
                  <button
                    type="button"
                    onClick={() => setIsSignUp(!isSignUp)}
                    className="text-xs text-cyan-400 hover:underline"
                  >
                    {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Register"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
