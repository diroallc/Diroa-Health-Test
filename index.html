<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diroa Health Profiles</title>

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // =========================================================================
    // 1. SUPABASE CONFIGURATION
    // =========================================================================
    const SUPABASE_URL = 'https://ikzrbztopdmxhneloyim.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrenJienRvcGRteGhuZWxveWltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzNzM0MDUsImV4cCI6MjEwNTk0OTQwNX0.yOtplAIElZrbdx-M-Cs12vE5Av6p8uBxiYY3IkHMCwA';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =========================================================================
    // 2. AUTHENTICATION & DATABASE HELPER FUNCTIONS
    // =========================================================================
    async function handleSignUp(email, password, fullName) {
      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: { data: { full_name: fullName } }
      });
      if (error) alert(error.message);
      else alert('Account created! Please check your email for a confirmation link.');
    }

    async function handleLogin(email, password) {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });
      if (error) {
        alert(error.message);
        return null;
      }
      return data.user;
    }

    async function handleLogout() {
      await supabase.auth.signOut();
    }

    async function fetchUserProfile(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .single();
      if (error) console.error('Error fetching profile:', error);
      return data;
    }

    async function saveUserProfile(userId, updatedFields) {
      const { data, error } = await supabase
        .from('profiles')
        .update(updatedFields)
        .eq('id', userId);
      if (error) {
        alert('Error saving: ' + error.message);
        return false;
      } else {
        alert('Health profile saved successfully to database!');
        return true;
      }
    }

    // =========================================================================
    // 3. APPLICATION COMPONENT
    // =========================================================================
    function App() {
      const [user, setUser] = React.useState(null);
      const [userProfile, setUserProfile] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [activeTab, setActiveTab] = React.useState('dashboard');
      
      // Auth Modal State
      const [showAuthModal, setShowAuthModal] = React.useState(false);
      const [isSignUp, setIsSignUp] = React.useState(false);
      const [authEmail, setAuthEmail] = React.useState('');
      const [authPassword, setAuthPassword] = React.useState('');
      const [authName, setAuthName] = React.useState('');

      // Editable Profile Form State
      const [editBloodType, setEditBloodType] = React.useState('');
      const [editDoctor, setEditDoctor] = React.useState('');
      const [editAge, setEditAge] = React.useState('');
      const [editHeight, setEditHeight] = React.useState('');
      const [editWeight, setEditWeight] = React.useState('');
      const [saving, setSaving] = React.useState(false);

      // Check session on mount and subscribe to changes
      React.useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) loadProfile(currentUser.id);
          setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          const currentUser = session?.user ?? null;
          setUser(currentUser);
          if (currentUser) loadProfile(currentUser.id);
          else setUserProfile(null);
        });

        return () => subscription.unsubscribe();
      }, []);

      async function loadProfile(userId) {
        const data = await fetchUserProfile(userId);
        if (data) {
          setUserProfile(data);
          setEditBloodType(data.blood_type || 'A+');
          setEditDoctor(data.primary_doctor || 'Dr. Sarah Jenkins');
          setEditAge(data.age || 30);
          setEditHeight(data.height || "5'10\"");
          setEditWeight(data.weight || '165 lbs');
        }
      }

      async function submitAuth(e) {
        e.preventDefault();
        if (isSignUp) {
          await handleSignUp(authEmail, authPassword, authName);
        } else {
          const loggedInUser = await handleLogin(authEmail, authPassword);
          if (loggedInUser) setShowAuthModal(false);
        }
      }

      async function handleProfileSave(e) {
        e.preventDefault();
        if (!user) return;
        setSaving(true);
        const success = await saveUserProfile(user.id, {
          blood_type: editBloodType,
          primary_doctor: editDoctor,
          age: parseInt(editAge) || 30,
          height: editHeight,
          weight: editWeight,
        });
        if (success) await loadProfile(user.id);
        setSaving(false);
      }

      if (loading) {
        return (
          <div className="flex h-screen items-center justify-center bg-slate-900 text-slate-100">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-lg font-medium">Connecting to Diroa Health Network...</p>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Top Header */}
          <header className="border-b border-slate-800 bg-slate-950 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-teal-400 flex items-center justify-center font-bold text-white shadow-lg">D</div>
              <div>
                <h1 className="text-lg font-bold tracking-wide text-white leading-none">Diroa Health</h1>
                <p className="text-[10px] text-cyan-400 uppercase tracking-wider mt-0.5">Profiles & Encrypted Portal</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            {user && (
              <nav className="hidden md:flex items-center gap-1 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'dashboard' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Dashboard
                </button>
                <button
                  onClick={() => setActiveTab('profile')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'profile' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Health Profile
                </button>
                <button
                  onClick={() => setActiveTab('vault')}
                  className={`px-4 py-1.5 text-xs font-semibold rounded-lg transition ${activeTab === 'vault' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}
                >
                  Medical Vault
                </button>
              </nav>
            )}

            <div>
              {user ? (
                <div className="flex items-center gap-4">
                  <span className="text-xs font-medium text-slate-400 hidden sm:inline">{user.email}</span>
                  <button
                    onClick={handleLogout}
                    className="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition"
                  >
                    Sign Out
                  </button>
                </div>
              ) : (
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition shadow-lg shadow-cyan-900/20"
                >
                  Sign In / Register
                </button>
              )}
            </div>
          </header>

          {/* Main Body */}
          <main className="p-6 max-w-6xl mx-auto flex-1 w-full">
            {user ? (
              <div className="space-y-6">
                {/* Active Tab View */}
                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="bg-gradient-to-r from-slate-800 to-slate-800/80 border border-slate-700/70 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                      <div className="absolute top-0 right-0 w-64 h-64 bg-cyan-500/5 rounded-full blur-3xl -z-0"></div>
                      <div className="relative z-10">
                        <span className="inline-block px-2.5 py-1 text-[10px] font-bold uppercase tracking-wider text-cyan-400 bg-cyan-950/60 border border-cyan-800/50 rounded-full mb-3">
                          Connected Account
                        </span>
                        <h2 className="text-2xl font-extrabold text-white mb-1">
                          Welcome, {userProfile?.full_name || user.email}
                        </h2>
                        <p className="text-xs text-slate-400 max-w-xl">
                          Your records are encrypted and synced directly to your Supabase PostgreSQL cloud database.
                        </p>
                      </div>
                    </div>

                    {/* Quick Stats Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-xs text-slate-400 mb-1 font-medium">Blood Type</p>
                        <p className="text-xl font-bold text-cyan-400">{userProfile?.blood_type || 'A+'}</p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-xs text-slate-400 mb-1 font-medium">Primary Doctor</p>
                        <p className="text-lg font-bold text-slate-100 truncate">{userProfile?.primary_doctor || 'Dr. Sarah Jenkins'}</p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-xs text-slate-400 mb-1 font-medium">Height & Weight</p>
                        <p className="text-lg font-bold text-slate-100">{userProfile?.height || `5'10"`} / {userProfile?.weight || '165 lbs'}</p>
                      </div>
                      <div className="bg-slate-800/60 border border-slate-700/60 rounded-xl p-4">
                        <p className="text-xs text-slate-400 mb-1 font-medium">Database User ID</p>
                        <p className="text-[11px] font-mono text-slate-400 truncate mt-1">{user.id}</p>
                      </div>
                    </div>

                    {/* Quick Actions */}
                    <div className="bg-slate-800/40 border border-slate-800 rounded-xl p-6">
                      <h3 className="text-sm font-bold text-slate-200 mb-3">Management Options</h3>
                      <div className="flex flex-wrap gap-3">
                        <button 
                          onClick={() => setActiveTab('profile')} 
                          className="px-4 py-2 text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg transition"
                        >
                          Edit Health Profile
                        </button>
                        <button 
                          onClick={() => setActiveTab('vault')} 
                          className="px-4 py-2 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition"
                        >
                          Access Medical Vault
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'profile' && (
                  <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 className="text-xl font-bold text-white mb-2">Edit Digital Health Profile</h2>
                    <p className="text-xs text-slate-400 mb-6">Updates saved here sync instantly with your Supabase database table.</p>

                    <form onSubmit={handleProfileSave} className="space-y-4 max-w-xl">
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Blood Type</label>
                          <select
                            value={editBloodType}
                            onChange={(e) => setEditBloodType(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          >
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Age</label>
                          <input
                            type="number"
                            value={editAge}
                            onChange={(e) => setEditAge(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Height</label>
                          <input
                            type="text"
                            value={editHeight}
                            onChange={(e) => setEditHeight(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-medium text-slate-400 mb-1">Weight</label>
                          <input
                            type="text"
                            value={editWeight}
                            onChange={(e) => setEditWeight(e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-medium text-slate-400 mb-1">Primary Physician</label>
                        <input
                          type="text"
                          value={editDoctor}
                          onChange={(e) => setEditDoctor(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        />
                      </div>

                      <button
                        type="submit"
                        disabled={saving}
                        className="px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-lg shadow-cyan-900/30 disabled:opacity-50"
                      >
                        {saving ? 'Saving Changes...' : 'Save Profile to Cloud'}
                      </button>
                    </form>
                  </div>
                )}

                {activeTab === 'vault' && (
                  <div className="bg-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">
                    <h2 className="text-xl font-bold text-white mb-2">Encrypted Medical Vault</h2>
                    <p className="text-xs text-slate-400 mb-6">Store and access secure laboratory records, prescriptions, and medical files.</p>

                    <div className="border-2 border-dashed border-slate-700 hover:border-cyan-500/50 rounded-xl p-8 text-center bg-slate-900/40 transition cursor-pointer">
                      <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-3 text-cyan-400">
                        📄
                      </div>
                      <p className="text-xs font-semibold text-slate-200">Drag and drop medical documents here</p>
                      <p className="text-[10px] text-slate-400 mt-1">Supports PDF, PNG, JPG up to 25MB</p>
                    </div>
                  </div>
                )}
              </div>
            ) : (
              /* Signed Out Hero State */
              <div className="text-center py-20">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-cyan-600 to-teal-400 flex items-center justify-center font-bold text-2xl text-white mx-auto mb-6 shadow-xl shadow-cyan-900/30">
                  D
                </div>
                <h2 className="text-3xl font-extrabold text-white mb-4">Secure Personal Health Portal</h2>
                <p className="text-slate-400 max-w-md mx-auto mb-8 text-xs leading-relaxed">
                  Sign in or create an account to view your digital health profile, store encrypted medical documents, and update primary provider records.
                </p>
                <button
                  onClick={() => setShowAuthModal(true)}
                  className="px-6 py-3 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-xl shadow-xl shadow-cyan-900/40 transition hover:scale-105 transform"
                >
                  Access Your Portal
                </button>
              </div>
            )}
          </main>

          {/* Auth Modal */}
          {showAuthModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full max-w-md shadow-2xl relative">
                <button 
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <h3 className="text-lg font-bold text-white mb-1">
                  {isSignUp ? 'Create Health Account' : 'Sign In to Diroa'}
                </h3>
                <p className="text-xs text-slate-400 mb-6">
                  {isSignUp ? 'Enter details to start your secure health record.' : 'Access your connected health profile.'}
                </p>
                
                <form onSubmit={submitAuth} className="space-y-4">
                  {isSignUp && (
                    <div>
                      <label className="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                      <input
                        type="text"
                        required
                        value={authName}
                        onChange={(e) => setAuthName(e.target.value)}
                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                        placeholder="Jane Doe"
                      />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Email Address</label>
                    <input
                      type="email"
                      required
                      value={authEmail}
                      onChange={(e) => setAuthEmail(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="name@example.com"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      value={authPassword}
                      onChange={(e) => setAuthPassword(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-cyan-500"
                      placeholder="••••••••"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs rounded-lg transition shadow-md shadow-cyan-900/30"
                  >
                    {isSignUp ? 'Create Account' : 'Sign In'}
                  </button>
                </form>

                <div className="mt-4 text-center">
                  <button
                    type="button"
                    onClick={() => setIsSignUp(!isSignUp)}
                    className="text-xs text-cyan-400 hover:underline"
                  >
                    {isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
