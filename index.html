    function MessagesView({ messages, setMessages, activeChatId, setActiveChatId, showToast }) {
      const [inputMessage, setInputMessage] = useState('');
      const activeChat = messages.find(m => m.id === activeChatId) || messages[0];

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;

        const newMsg = {
          id: Date.now(),
          sender: "user",
          text: inputMessage.trim(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const updatedMessages = messages.map(chat => {
          if (chat.id === activeChatId) {
            return {
              ...chat,
              history: [...chat.history, newMsg]
            };
          }
          return chat;
        });

        setMessages(updatedMessages);
        setInputMessage('');

        // Simulated automated clinical response
        setTimeout(() => {
          setMessages(prev => prev.map(chat => {
            if (chat.id === activeChatId) {
              return {
                ...chat,
                history: [
                  ...chat.history,
                  {
                    id: Date.now() + 1,
                    sender: "doctor",
                    text: `Thank you for your message, Alex. Dr. ${chat.name.split(' ')[1]} has received your message and will review it during clinic hours.`,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                  }
                ]
              };
            }
            return chat;
          }));
        }, 1500);
      };

      return (
        <div className="max-w-5xl mx-auto h-[calc(100vh-8rem)] bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl overflow-hidden flex shadow-sm">

                  <div className="relative">
                    <img src={chat.avatar} alt={chat.name} className="w-10 h-10 rounded-full object-cover" />
                    {chat.online && <span className="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-white dark:ring-slate-900"></span>}

                <div>

                </div>

            {[
              { key: 'researchSharing', label: 'Anonymized Research Consent', desc: 'Allow de-identified telemetry data to support university metabolic research.' },
              { key: 'emergencyAccess', label: 'Emergency First Responder Bypass', desc: 'Permit verified EMTs to scan your Health ID QR during medical emergencies.' },
              { key: 'wearableSync', label: 'Continuous Telemetry Sync', desc: 'Automatically import heart rate and sleep logs from paired sensor devices.' }
            ].map(item => (
              <div key={item.key} className="flex items-center justify-between gap-4">
                <div>
                  <h4 className="font-bold text-xs">{item.label}</h4>
                  <p className="text-[11px] text-slate-400 mt-0.5">{item.desc}</p>
                </div>
                <button 
                  onClick={() => toggleSetting(item.key)}
                  className={`w-12 h-6 rounded-full transition-colors relative ${settings[item.key] ? 'bg-sky-600' : 'bg-slate-300 dark:bg-slate-700'}`}
                >
                  <span className={`w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform ${settings[item.key] ? 'translate-x-6' : 'translate-x-0'}`}></span>
                </button>
              </div>
            ))}
          </div>

          <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm space-y-6">
            <h3 className="font-bold text-base border-b border-slate-100 dark:border-slate-800 pb-3">Security & Account Safeguards</h3>
            
            <div className="flex items-center justify-between">
              <div>
                <h4 className="font-bold text-xs">Two-Factor Authentication (2FA)</h4>
                <p className="text-[11px] text-slate-400 mt-0.5">Required for unlocking Encrypted Medical Vault on new devices.</p>
              </div>
              <span className="text-xs text-emerald-500 font-bold bg-emerald-500/10 px-3 py-1 rounded-full">ACTIVE</span>
            </div>

            <div className="flex items-center justify-between">
              <div>
                <h4 className="font-bold text-xs">Master Encryption Key</h4>
                <p className="text-[11px] text-slate-400 mt-0.5">Key hash ends in ...94021-AES-GCM</p>
              </div>
              <button onClick={() => showToast("Backup Key saved to device")} className="text-xs text-sky-500 font-semibold hover:underline">
                Export Backup Key
              </button>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
